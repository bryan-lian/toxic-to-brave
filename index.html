ans'; letter-spacing:.04em; padding:9px 15px; border-radius:999px; background:{{ chip.bg }}; color:{{ chip.col }}; border:1px solid {{ chip.border }}; transition:all .18s ease\">{{ chip.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <\u0021-- facilitator guide panel -->\n        <sc-if value=\"{{ facilitatorPanelOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"ttb-scroll\" style=\"flex:0 0 auto; max-height:210px; overflow-y:auto; background:rgba(201,162,75,.055); border:1px solid rgba(201,162,75,.22); border-radius:18px; padding:14px 15px 12px; margin-bottom:10px\">\n            <sc-if value=\"{{ hasSafetyFlags }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex; align-items:center; gap:8px; background:rgba(97,33,27,.5); border:1px solid rgba(224,115,92,.4); border-radius:10px; padding:9px 12px; margin-bottom:11px\">\n                <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\" stroke=\"#e0a06a\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                <div style=\"font:600 11.5px/1.4 'Reo Sans','Plus Jakarta Sans'; color:#e0a06a\">{{ safetyFlagLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.2em; text-transform:uppercase; color:#c9a24b; margin-bottom:9px\">Watch for<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:5px; margin-bottom:12px\">\n              <sc-for list=\"{{ watchForList }}\" as=\"w\" hint-placeholder-count=\"3\">\n                <div style=\"font:400 13px/1.5 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; padding-left:11px; border-left:2px solid rgba(201,162,75,.38)\">{{ w.text }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"background:rgba(30,70,50,.45); border:1px solid rgba(127,206,159,.18); border-radius:11px; padding:10px 12px; margin-bottom:11px\">\n              <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.18em; text-transform:uppercase; color:#7fce9f; margin-bottom:5px\">PFF Reframe<\u002Fdiv>\n              <div style=\"font:400 13px/1.5 'Reo Sans','Plus Jakarta Sans'; color:#c5e2cf\">{{ pff }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex; gap:8px\">\n              <div sc-camel-on-click=\"{{ showStalled }}\" style=\"cursor:pointer; flex:1; text-align:center; font:600 11.5px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.04em; padding:9px 8px; border-radius:10px; background:rgba(201,162,75,.1); border:1px solid rgba(201,162,75,.26); color:#d8b25f\" style-active=\"transform:scale(.97)\">If Stalled<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ showHeated }}\" style=\"cursor:pointer; flex:1; text-align:center; font:600 11.5px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.04em; padding:9px 8px; border-radius:10px; background:rgba(224,115,92,.08); border:1px solid rgba(224,115,92,.26); color:#e0a06a\" style-active=\"transform:scale(.97)\">If Heated<\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ stalledShown }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:10px; padding:10px 12px; border-radius:11px; background:rgba(201,162,75,.06); border:1px solid rgba(201,162,75,.2)\">\n                <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.16em; text-transform:uppercase; color:#c9a24b; margin-bottom:7px\">When stalled<\u002Fdiv>\n                <sc-for list=\"{{ stalledList }}\" as=\"sl\" hint-placeholder-count=\"3\">\n                  <div style=\"font:400 13px/1.5 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; padding-left:11px; border-left:2px solid rgba(201,162,75,.28); margin-bottom:5px\">{{ sl.text }}<\u002Fdiv>\n ; margin-top:5px\">{{ d.body }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div sc-camel-on-click=\"{{ goGuide }}\" style=\"margin-top:16px; flex:0 0 auto; cursor:pointer; text-align:center; background:rgba(201,162,75,.08); border:1px solid rgba(201,162,75,.28); color:#d8b25f; font:600 13px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.04em; padding:14px; border-radius:14px\" style-active=\"transform:scale(.98)\">Open full facilitator guide →<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <\u0021-- ============================ COHORT DETAIL ============================ -->\n    <sc-if value=\"{{ isCohort }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"ttb-scroll\" style=\"flex:1; display:flex; flex-direction:column; padding:22px 26px 26px; overflow-y:auto\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; flex:0 0 auto\">\n          <div sc-camel-on-click=\"{{ goNavHome }}\" style=\"cursor:pointer; width:38px; height:38px; border-radius:50%; border:1px solid rgba(201,162,75,.28); display:flex; align-items:center; justify-content:center; color:#c9a24b; font-size:17px\" style-active=\"transform:scale(.94)\">‹<\u002Fdiv>\n          <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.14em; text-transform:uppercase; color:#8a7d6a\">{{ coKindLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; align-items:center; gap:9px; margin-top:16px\">\n          <div style=\"width:10px; height:10px; border-radius:3px; background:{{ coCol }}\"><\u002Fdiv>\n          <div style=\"font:600 34px/1.04 'Cormorant Garamond'; color:#f3e8d6\">{{ coName }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <\u0021-- Gauge hero -->\n        <div style=\"margin-top:16px; background:rgba(201,162,75,.05); border:1px solid rgba(201,162,75,.2); border-radius:18px; padding:16px 17px\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between\">\n            <div>\n              <div style=\"font:600 9.5px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.16em; text-transform:uppercase; color:#9c7e4e\">Culture gauge<\u002Fdiv>\n              <div style=\"display:flex; align-items:baseline; gap:8px; margin-top:8px\">\n                <div style=\"font:600 44px/1 'Cormorant Garamond'; color:{{ coBandColor }}\">{{ coGauge }}<\u002Fdiv>\n                <div style=\"font:400 15px/1 'Cormorant Garamond'; color:#6f6353\">/ 9<\u002Fdiv>\n                <div style=\"font:600 13px/1 'Reo Sans','Plus Jakarta Sans'; color:#7fce9f; margin-left:2px\">{{ coDelta }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font:500 9.5px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.1em; text-transform:uppercase; color:{{ coBandColor }}; margin-top:7px\">{{ coBand }} zone<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:0 0 auto; transform:scale(1.5); transform-origin:right center; opacity:.95\">{{ coSpark }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:4px; margin-top:16px\">\n            <div style=\"flex:3; height:4px; border-radius:2px; background:rgba(217,140,106,.4)\"><\u002Fdiv>\n            <div style=\"flex:3; height:4px; border-radius:2px; background:rgba(224,189,114,.4)\"><\u002Fdiv>\n            <div style=\"flex:3; height:4px; border-radius:2px; background:rgba(127,206,159,.4)\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; margin-top:5px; font:500 8px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.08em; text-transform:uppercase; color:#6f6353\">\n            <div>Toxic 1–3<\u002Fdiv><div>Emerging 4–6<\u002Fdiv><div>Brave 7–9<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <\u0021-- 4-D arc -->\n        <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.16em; text-transform:uppercase; color:#9c7e4e; margin:22px 0 12px\">Where this team is · 4-D arc<\u002Fdiv>\n        <div style=\"display:flex; align-items:flex-start; justify-content:space-between; position:relative\">\n          <sc-for list=\"{{ coArc }}\" as=\"d\" hint-placeholder-count=\"4\">\n            <div style=\"flex:1; display:flex; flex-direction:column; align-items:center; gap:7px; text-align:center\">\n              <div style=\"width:15px; height:15px; border-radius:50%; background:{{ d.dotBg }}; border:1.5px solid {{ d.dotBorder }}\"><\u002Fdiv>\n              <div style=\"font:600 11px/1.1 'Reo Sans','Plus Jakarta Sans'; color:{{ d.textCol }}\">{{ d.name }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <\u0021-- Actions -->\n        <sc-if value=\"{{ coUnfinished }}\" hint-placeholder-val=\"{{ false }}\">\n          <div sc-camel-on-click=\"{{ coResume }}\" style=\"cursor:pointer; margin-top:20px; text-align:center; background:linear-gradient(180deg,#d4ad58,#bb8f3c); color:#1a1206; font:600 14px/1 'Reo Sans','Plus Jakarta Sans'; padding:16px; border-radius:14px; box-shadow:0 14px 30px -16px rgba(201,162,75,.55)\" style-active=\"transform:scale(.98)\">Resume current session →<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ coFinished }}\" hint-placeholder-val=\"{{ true }}\">\n          <div sc-camel-on-click=\"{{ coRunNext }}\" style=\"cursor:pointer; margin-top:20px; text-align:center; background:linear-gradient(180deg,#d4ad58,#bb8f3c); color:#1a1206; font:600 14px/1 'Reo Sans','Plus Jakarta Sans'; padding:16px; border-radius:14px; box-shadow:0 14px 30px -16px rgba(201,162,75,.55)\" style-active=\"transform:scale(.98)\">Run the next session →<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"text-align:center; font:500 11px/1 'Reo Sans','Plus Jakarta Sans'; color:#8a7d6a; margin-top:9px\">{{ coNextDue }}<\u002Fdiv>\n\n        <\u0021-- Timeline -->\n        <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.16em; text-transform:uppercase; color:#9c7e4e; margin:24px 0 12px\">Session timeline<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:8px\">\n          <sc-for list=\"{{ coTimeline }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <div style=\"background:rgba(201,162,75,.04); border:1px solid rgba(201,162,75,.15); border-radius:13px; padding:12px 14px\">\n              <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px\">\n                <div style=\"display:flex; align-items:center; gap:10px; min-width:0\">\n                  <div style=\"font:600 12px/1 'Reo Sans','Plus Jakarta Sans'; color:#d8b25f; width:44px; flex:0 0 auto\">{{ t.date }}<\u002Fdiv>\n                  <div style=\"font:600 14px/1 'Cormorant Garamond'; color:#f3e3da\">{{ t.phase }}<\u002Fdiv>\n                  <div style=\"font:500 10px/1 'Reo Sans','Plus Jakarta Sans'; color:#8a7d6a\">· {{ t.cards }} cards<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:0 0 auto; display:flex; align-items:center; gap:8px\">\n                  <div style=\"font:600 13px/1 'Cormorant Garamond'; color:{{ t.gaugeCol }}\">{{ t.gauge }}<\u002Fdiv>\n                  <div style=\"font:600 9px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.04em; text-transform:uppercase; color:{{ t.keptCol }}; background:{{ t.keptBg }}; padding:4px 7px; border-radius:6px\">{{ t.keptLabel }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ t.hasCommit }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font:400 12px/1.45 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; margin-top:8px\">“{{ t.commit }}”<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <\u0021-- Assessment -->\n        <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.16em; text-transform:uppercase; color:#9c7e4e; margin:24px 0 12px\">Culture self-assessment<\u002Fdiv>\n        <div style=\"background:rgba(143,179,224,.06); border:1px solid rgba(143,179,224,.24); border-radius:14px; padding:15px 16px\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between\">\n            <div>\n              <div style=\"display:flex; align-items:baseline; gap:8px\">\n                <div style=\"font:600 30px/1 'Cormorant Garamond'; color:#9fb4cf\">{{ coAssessLatest }}<\u002Fdiv>\n                <div style=\"font:600 13px/1 'Reo Sans','Plus Jakarta Sans'; color:#7fce9f\">{{ coAssessDelta }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font:500 10px/1.3 'Reo Sans','Plus Jakarta Sans'; color:#8a7d6a; margin-top:6px\">since baseline · last taken {{ coAssessDate }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div sc-camel-on-click=\"{{ coOpenAssess }}\" style=\"cursor:pointer; flex:0 0 auto; background:rgba(143,179,224,.14); border:1px solid rgba(143,179,224,.35); color:#9fb4cf; font:600 12px/1 'Reo Sans','Plus Jakarta Sans'; padding:12px 15px; border-radius:999px\" style-active=\"transform:scale(.97)\">Retake scale<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <\u0021-- Participants -->\n        <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.16em; text-transform:uppercase; color:#9c7e4e; margin:24px 0 12px\">Participants<\u002Fdiv>\n        <div style=\"display:flex; flex-wrap:wrap; gap:8px\">\n          <sc-for list=\"{{ coParticipants }}\" as=\"p\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex; align-items:center; gap:8px; background:{{ p.chipBg }}; border:1px solid {{ p.chipBorder }}; border-radius:999px; padding:6px 12px 6px 7px\">\n              <div style=\"width:24px; height:24px; border-radius:50%; background:{{ p.avBg }}; box-shadow:0 0 0 1px rgba(201,162,75,.3); display:flex; align-items:center; justify-content:center; font:600 10px/1 'Cormorant Garamond'; color:{{ p.avCol }}\">{{ p.initial }}<\u002Fdiv>\n              <div style=\"font:500 12.5px/1 'Reo Sans','Plus Jakarta Sans'; color:#d9cbb5\">{{ p.name }}<\u002Fdiv>\n              <sc-if value=\"{{ p.showFac }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font:600 8px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.08em; text-transform:uppercase; color:#9fb4cf; background:rgba(143,179,224,.14); padding:3px 6px; border-radius:5px\">Facilitator<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <\u0021-- ============================ RESEARCH DASHBOARD ============================ -->\n    <sc-if value=\"{{ isResearch }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"ttb-scroll\" style=\"flex:1; display:flex; flex-direction:column; padding:22px 24px 26px; overflow-y:auto\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; flex:0 0 auto\">\n          <div>\n            <div style=\"font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.24em; text-transform:uppercase; color:#8fb3e0\">Research console<\u002Fdiv>\n            <div style=\"font:600 34px/1.04 'Cormorant Garamond'; color:#f3e8d6; margin-top:8px\">Culture, measured<\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ toggleRole }}\" style=\"cursor:pointer; text-align:center; background:rgba(201,162,75,.08); border:1px solid rgba(201,162,75,.3); color:#d8b25f; font:600 10px/1.1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.06em; padding:9px 12px; border-radius:11px\" style-active=\"transform:scale(.96)\">Facilitator<br>view<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font:400 12.5px/1.5 'Reo Sans','Plus Jakarta Sans'; color:#8a7d6a; margin-top:10px\">De-identified program data across cohorts. Every figure exports to your analysis software.<\u002Fdiv>\n\n        <\u0021-- Scope -->\n        <div style=\"display:flex; flex-wrap:wrap; gap:7px; margin-top:16px\">\n          <sc-for list=\"{{ scopeChips }}\" as=\"ch\" hint-placeholder-count=\"3\">\n            <div sc-camel-on-click=\"{{ ch.on }}\" style=\"cursor:pointer; white-space:nowrap; font:600 11.5px/1 'Reo Sans','Plus Jakarta Sans'; padding:9px 14px; border-radius:999px; background:{{ ch.bg }}; color:{{ ch.col }}; border:1px solid {{ ch.border }}\" style-active=\"transform:scale(.97)\">{{ ch.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <\u0021-- KPIs -->\n        <div style=\"display:flex; gap:8px; margin-top:16px\">\n          <div style=\"flex:1; background:rgba(201,162,75,.06); border:1px solid rgba(201,162,75,.2); border-radius:14px; padding:12px 10px\">\n            <div style=\"font:600 24px/1 'Cormorant Garamond'; color:#e0bd72\">{{ rKpiCohorts }}<\u002Fdiv>\n            <div style=\"font:500 8px/1.2 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.04em; text-transform:uppercase; color:#8a7d6a; margin-top:5px\">Cohorts<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1; background:rgba(201,162,75,.06); border:1px solid rgba(201,162,75,.2); border-radius:14px; padding:12px 10px\">\n            <div style=\"font:600 24px/1 'Cormorant Garamond'; color:#e0bd72\">{{ rKpiParts }}<\u002Fdiv>\n            <div style=\"font:500 8px/1.2 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.04em; text-transform:uppercase; color:#8a7d6a; margin-top:5px\">Participants<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1; background:rgba(127,206,159,.07); border:1px solid rgba(127,206,159,.24); border-radius:14px; padding:12px 10px\">\n            <div style=\"font:600 24px/1 'Cormorant Garamond'; color:#7fce9f\">{{ rKpiShift }}<\u002Fdiv>\n            <div style=\"font:500 8px/1.2 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.04em; text-transform:uppercase; color:#8a7d6a; margin-top:5px\">Gauge shift<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1; background:rgba(201,162,75,.06); border:1px solid rgba(201,162,75,.2); border-radius:14px; padding:12px 10px\">\n            <div style=\"font:600 24px/1 'Cormorant Garamond'; color:#e0bd72\">{{ rKpiAdherence }}<\u002Fdiv>\n            <div style=\"font:500 8px/1.2 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.04em; text-transform:uppercase; color:#8a7d6a; margin-top:5px\">Commit kept<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <\u0021-- Gauge over time -->\n        <div style=\"margin-top:20px; background:rgba(255,255,255,.02); border:1px solid rgba(201,162,75,.16); border-radius:16px; padding:15px 15px 12px\">\n          <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.14em; text-transform:uppercase; color:#9c7e4e\">Culture gauge over sessions<\u002Fdiv>\n          <div style=\"margin-top:12px\">{{ rTrend }}<\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; gap:10px 14px; margin-top:8px\">\n            <sc-for list=\"{{ rLegend }}\" as=\"l\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex; align-items:center; gap:6px\"><div style=\"width:9px; height:3px; border-radius:2px; background:{{ l.col }}\"><\u002Fdiv><div style=\"font:500 10px/1 'Reo Sans','Plus Jakarta Sans'; color:#8a7d6a\">{{ l.name }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <\u0021-- SNA -->\n        <div style=\"margin-top:14px; background:rgba(255,255,255,.02); border:1px solid rgba(201,162,75,.16); border-radius:16px; padding:15px 15px 13px\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between\">\n            <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.14em; text-transform:uppercase; color:#9c7e4e\">Social network<\u002Fdiv>\n            <div style=\"display:flex; gap:12px\">\n              <div style=\"font:500 10px/1 'Reo Sans','Plus Jakarta Sans'; color:#8a7d6a\">{{ rSNAEdges }} ties<\u002Fdiv>\n              <div style=\"font:500 10px/1 'Reo Sans','Plus Jakarta Sans'; color:#8a7d6a\">density {{ rSNADensity }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:8px\">{{ rSNA }}<\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:6px\">\n            <div style=\"display:flex; align-items:center; gap:6px\"><div style=\"width:9px; height:9px; border-radius:50%; background:#f3e8d6; box-shadow:0 0 0 2px rgba(243,232,214,.35)\"><\u002Fdiv><div style=\"font:500 10px/1 'Reo Sans','Plus Jakarta Sans'; color:#8a7d6a\">Facilitator<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex; align-items:center; gap:6px\"><svg width=\"18\" height=\"6\"><line x1=\"0\" y1=\"3\" x2=\"18\" y2=\"3\" stroke=\"#f3e8d6\" stroke-opacity=\"0.5\" stroke-width=\"1\" stroke-dasharray=\"3 3\"><\u002Fline><\u002Fsvg><div style=\"font:500 10px/1 'Reo Sans','Plus Jakarta Sans'; color:#8a7d6a\">Same person, another cohort<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:16px; margin-top:9px\">\n            <div style=\"font:500 10.5px/1 'Reo Sans','Plus Jakarta Sans'; color:#9fb4cf\">{{ rFacilitators }} facilitator(s)<\u002Fdiv>\n            <div style=\"font:500 10.5px/1 'Reo Sans','Plus Jakarta Sans'; color:#9fb4cf\">{{ rSharedMembers }} in multiple cohorts<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font:400 10.5px/1.4 'Reo Sans','Plus Jakarta Sans'; color:#6f6353; margin-top:8px\">Node size = connections. Solid ties are within-cohort; dashed links bridge people who appear in more than one cohort.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <\u0021-- Assessment pre/post -->\n        <div style=\"margin-top:14px; background:rgba(255,255,255,.02); border:1px solid rgba(201,162,75,.16); border-radius:16px; padding:15px 15px 13px\">\n          <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.14em; text-transform:uppercase; color:#9c7e4e\">Self-assessment · baseline → latest<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:12px; margin-top:13px\">\n            <sc-for list=\"{{ rAssess }}\" as=\"a\" hint-placeholder-count=\"4\">\n              <div>\n                <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:6px\">\n                  <div style=\"font:500 11.5px/1 'Reo Sans','Plus Jakarta Sans'; color:#d9cbb5\">{{ a.name }}<\u002Fdiv>\n                  <div style=\"font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; color:{{ a.deltaCol }}\">{{ a.delta }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"position:relative; height:8px; border-radius:4px; background:rgba(201,162,75,.1)\">\n                  <div style=\"position:absolute; left:0; top:0; height:100%; width:{{ a.preW }}; border-radius:4px; background:rgba(201,162,75,.25)\"><\u002Fdiv>\n                  <div style=\"position:absolute; left:0; top:0; height:100%; width:{{ a.latestW }}; border-radius:4px; background:{{ a.col }}\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <\u0021-- Export -->\n        <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.14em; text-transform:uppercase; color:#9c7e4e; margin:22px 0 11px\">Export for analysis<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:8px\">\n          <div sc-camel-on-click=\"{{ exportSessions }}\" style=\"cursor:pointer; display:flex; align-items:center; justify-content:space-between; background:rgba(201,162,75,.06); border:1px solid rgba(201,162,75,.28); border-radius:13px; padding:13px 15px\" style-active=\"transform:scale(.99)\">\n            <div><div style=\"font:600 13px/1 'Reo Sans','Plus Jakarta Sans'; color:#e7dccb\">Sessions &amp; gauge<\u002Fdiv><div style=\"font:400 10.5px/1 'Reo Sans','Plus Jakarta Sans'; color:#8a7d6a; margin-top:4px\">CSV · long format, one row per session<\u002Fdiv><\u002Fdiv>\n            <div style=\"font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; color:#d8b25f\">↓ CSV<\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ exportSNA }}\" style=\"cursor:pointer; display:flex; align-items:center; justify-content:space-between; background:rgba(201,162,75,.06); border:1px solid rgba(201,162,75,.28); border-radius:13px; padding:13px 15px\" style-active=\"transform:scale(.99)\">\n            <div><div style=\"font:600 13px/1 'Reo Sans','Plus Jakarta Sans'; color:#e7dccb\">Network edgelist<\u002Fdiv><div style=\"font:400 10.5px/1 'Reo Sans','Plus Jakarta Sans'; color:#8a7d6a; margin-top:4px\">CSV · source–target for SNA tools<\u002Fdiv><\u002Fdiv>\n            <div style=\"font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; color:#d8b25f\">↓ CSV<\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ exportMembership }}\" style=\"cursor:pointer; display:flex; align-items:center; justify-content:space-between; background:rgba(201,162,75,.06); border:1px solid rgba(201,162,75,.28); border-radius:13px; padding:13px 15px\" style-active=\"transform:scale(.99)\">\n            <div><div style=\"font:600 13px/1 'Reo Sans','Plus Jakarta Sans'; color:#e7dccb\">Membership &amp; roles<\u002Fdiv><div style=\"font:400 10.5px/1 'Reo Sans','Plus Jakarta Sans'; color:#8a7d6a; margin-top:4px\">CSV · person · cohort · role (facilitator/member)<\u002Fdiv><\u002Fdiv>\n            <div style=\"font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; color:#d8b25f\">↓ CSV<\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ exportAssess }}\" style=\"cursor:pointer; display:flex; align-items:center; justify-content:space-between; background:rgba(201,162,75,.06); border:1px solid rgba(201,162,75,.28); border-radius:13px; padding:13px 15px\" style-active=\"transform:scale(.99)\">\n            <div><div style=\"font:600 13px/1 'Reo Sans','Plus Jakarta Sans'; color:#e7dccb\">Assessment scores<\u002Fdiv><div style=\"font:400 10.5px/1 'Reo Sans','Plus Jakarta Sans'; color:#8a7d6a; margin-top:4px\">CSV · baseline, latest, delta per cohort<\u002Fdiv><\u002Fdiv>\n            <div style=\"font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; color:#d8b25f\">↓ CSV<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasExportFlash }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:10px; text-align:center; font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; color:#7fce9f\">Downloaded {{ exportedFlash }}<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <\u0021-- ============================ ASSESSMENT ============================ -->\n    <sc-if value=\"{{ isAssess }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"ttb-scroll\" style=\"flex:1; display:flex; flex-direction:column; padding:22px 26px 26px; overflow-y:auto\">\n        <div sc-camel-on-click=\"{{ assessBackCohort }}\" style=\"cursor:pointer; width:38px; height:38px; flex:0 0 auto; border-radius:50%; border:1px solid rgba(201,162,75,.28); display:flex; align-items:center; justify-content:center; color:#c9a24b; font-size:17px\" style-active=\"transform:scale(.94)\">‹<\u002Fdiv>\n\n        <sc-if value=\"{{ assessDone }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px 6px\">\n            <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.2em; text-transform:uppercase; color:#8fb3e0\">Recorded<\u002Fdiv>\n            <div style=\"font:600 72px/1 'Cormorant Garamond'; color:#9fb4cf; margin-top:14px\">{{ assessScore }}<\u002Fdiv>\n            <div style=\"font:400 14px/1.6 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; margin-top:12px; max-width:280px\">{{ assessCohortName }}'s culture score is logged. Retake it after the next session to track the shift.<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ assessBackCohort }}\" style=\"cursor:pointer; margin-top:30px; background:linear-gradient(180deg,#d4ad58,#bb8f3c); color:#1a1206; font:600 14px/1 'Reo Sans','Plus Jakarta Sans'; padding:15px 34px; border-radius:999px\" style-active=\"transform:scale(.98)\">Back to cohort<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ assessNotDone }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.2em; text-transform:uppercase; color:#8fb3e0; margin-top:16px\">Culture self-assessment · Scale<\u002Fdiv>\n          <div style=\"font:600 32px/1.06 'Cormorant Garamond'; color:#f3e8d6; margin-top:10px\">{{ assessCohortName }}<\u002Fdiv>\n          <div style=\"font:400 13.5px/1.55 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; margin-top:10px\">Rate each statement from 1 (strongly disagree) to 7 (strongly agree). Placeholder instrument for the demo.<\u002Fdiv>\n\n          <div style=\"display:flex; flex-direction:column; gap:18px; margin-top:22px\">\n            <sc-for list=\"{{ assessItems }}\" as=\"q\" hint-placeholder-count=\"5\">\n              <div>\n                <div style=\"font:500 14px/1.4 'Reo Sans','Plus Jakarta Sans'; color:#e7dccb\">{{ q.text }}<\u002Fdiv>\n                <div style=\"display:flex; gap:6px; margin-top:10px\">\n                  <sc-for list=\"{{ q.scale }}\" as=\"v\" hint-placeholder-count=\"7\">\n                    <div sc-camel-on-click=\"{{ v.on }}\" style=\"cursor:pointer; flex:1; text-align:center; font:600 14px/1 'Cormorant Garamond'; padding:11px 0; border-radius:10px; background:{{ v.bg }}; color:{{ v.col }}; border:1px solid {{ v.border }}\" style-active=\"transform:scale(.95)\">{{ v.v }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ assessComplete }}\" hint-placeholder-val=\"{{ false }}\">\n            <div sc-camel-on-click=\"{{ assessSubmit }}\" style=\"cursor:pointer; margin-top:26px; text-align:center; background:linear-gradient(180deg,#d4ad58,#bb8f3c); color:#1a1206; font:600 15px/1 'Reo Sans','Plus Jakarta Sans'; padding:16px; border-radius:14px; box-shadow:0 14px 30px -16px rgba(201,162,75,.55)\" style-active=\"transform:scale(.98)\">Record score<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ assessIncomplete }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin-top:26px; text-align:center; background:rgba(201,162,75,.06); border:1px solid rgba(201,162,75,.2); color:#8a7d6a; font:600 13px/1 'Reo Sans','Plus Jakarta Sans'; padding:16px; border-radius:14px\">Answer every item to record<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <\u0021-- ============================ LEAVE COHORT ============================ -->\n    <sc-if value=\"{{ isLeave }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"ttb-scroll\" style=\"flex:1; display:flex; flex-direction:column; padding:22px 28px 26px; overflow-y:auto\">\n        <div sc-camel-on-click=\"{{ cancelLeave }}\" style=\"cursor:pointer; width:38px; height:38px; flex:0 0 auto; border-radius:50%; border:1px solid rgba(201,162,75,.28); display:flex; align-items:center; justify-content:center; color:#c9a24b; font-size:17px\" style-active=\"transform:scale(.94)\">‹<\u002Fdiv>\n        <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.2em; text-transform:uppercase; color:#d98c6a; margin-top:16px\">Leaving a cohort<\u002Fdiv>\n        <div style=\"font:600 32px/1.06 'Cormorant Garamond'; color:#f3e8d6; margin-top:10px\">Why are you leaving {{ leaveName }}?<\u002Fdiv>\n        <div style=\"font:400 13.5px/1.55 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; margin-top:10px\">This removes the cohort from your dashboard. Your reason is logged with the program's exit data — it helps the research see why teams stop.<\u002Fdiv>\n\n        <div style=\"display:flex; flex-direction:column; gap:8px; margin-top:22px\">\n          <sc-for list=\"{{ leaveReasons }}\" as=\"r\" hint-placeholder-count=\"5\">\n            <div sc-camel-on-click=\"{{ r.on }}\" style=\"cursor:pointer; font:600 14px/1 'Reo Sans','Plus Jakarta Sans'; padding:15px 16px; border-radius:13px; background:{{ r.bg }}; color:{{ r.col }}; border:1px solid {{ r.border }}\" style-active=\"transform:scale(.99)\">{{ r.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"font:600 10.5px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.16em; text-transform:uppercase; color:#8a7d6a; margin:22px 0 9px\">Anything you'd add? · optional<\u002Fdiv>\n        <textarea ref=\"{{ leaveDetailRef }}\" placeholder=\"In a sentence, what changed?\" style=\"width:100%; min-height:88px; resize:none; background:rgba(201,162,75,.06); border:1px solid rgba(201,162,75,.3); border-radius:13px; padding:14px 15px; color:#f3e8d6; font:400 14px/1.5 'Reo Sans','Plus Jakarta Sans'; outline:none\" style-focus=\"border-color:#d8b25f\"><\u002Ftextarea>\n\n        <sc-if value=\"{{ leaveCanConfirm }}\" hint-placeholder-val=\"{{ false }}\">\n          <div sc-camel-on-click=\"{{ confirmLeave }}\" style=\"cursor:pointer; margin-top:22px; text-align:center; background:linear-gradient(180deg,#a8460f,#7a2a20); color:#f7e6dc; font:600 15px/1 'Reo Sans','Plus Jakarta Sans'; padding:16px; border-radius:14px\" style-active=\"transform:scale(.98)\">Leave {{ leaveName }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ leaveCannotConfirm }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"margin-top:22px; text-align:center; background:rgba(201,162,75,.06); border:1px solid rgba(201,162,75,.2); color:#8a7d6a; font:600 13px/1 'Reo Sans','Plus Jakarta Sans'; padding:16px; border-radius:14px\">Pick a reason to continue<\u002Fdiv>\n        <\u002Fsc-if>\n        <div sc-camel-on-click=\"{{ cancelLeave }}\" style=\"cursor:pointer; margin-top:10px; text-align:center; font:600 13px/1 'Reo Sans','Plus Jakarta Sans'; color:#9c7e4e; padding:12px\" style-active=\"opacity:.7\">Keep this cohort<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <\u0021-- BOTTOM NAV -->\n    <sc-if value=\"{{ showNav }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:0 0 auto; display:flex; align-items:center; justify-content:space-around; background:rgba(10,8,7,.97); border-top:1px solid rgba(201,162,75,.16); padding:10px 0 18px\">\n        <div sc-camel-on-click=\"{{ goNavHome }}\" style=\"cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:5px; padding:4px 20px\" style-active=\"opacity:.6\">\n          <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z\" stroke=\"{{ navHomeCol }}\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M9 21V12h6v9\" stroke=\"{{ navHomeCol }}\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.07em; text-transform:uppercase; color:{{ navHomeCol }}\">Home<\u002Fdiv>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ goNavPractice }}\" style=\"cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:5px; padding:4px 20px\" style-active=\"opacity:.6\">\n          <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M9 11l3 3L22 4\" stroke=\"{{ navPracticeCol }}\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\" stroke=\"{{ navPracticeCol }}\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.07em; text-transform:uppercase; color:{{ navPracticeCol }}\">Practice<\u002Fdiv>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ goNavFacilitate }}\" style=\"cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:5px; padding:4px 20px\" style-active=\"opacity:.6\">\n          <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><circle cx=\"9\" cy=\"7\" r=\"4\" stroke=\"{{ navFacilitateCol }}\" stroke-width=\"1.7\"><\u002Fcircle><path d=\"M3 20c0-3.3 2.7-6 6-6\" stroke=\"{{ navFacilitateCol }}\" stroke-width=\"1.7\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M17 13v4m0 4v.01\" stroke=\"{{ navFacilitateCol }}\" stroke-width=\"1.7\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"17\" cy=\"17\" r=\"5\" stroke=\"{{ navFacilitateCol }}\" stroke-width=\"1.7\"><\u002Fcircle><\u002Fsvg>\n          <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.07em; text-transform:uppercase; color:{{ navFacilitateCol }}\">Facilitate<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ isResearcher }}\" hint-placeholder-val=\"{{ false }}\">\n          <div sc-camel-on-click=\"{{ goNavResearch }}\" style=\"cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:5px; padding:4px 20px\" style-active=\"opacity:.6\">\n            <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\" stroke=\"{{ navResearchCol }}\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.07em; text-transform:uppercase; color:{{ navResearchCol }}\">Research<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: 480, &quot;height&quot;: 940 },\n  &quot;palette&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Gold&quot;, &quot;Ember&quot;, &quot;Moonlit&quot;], &quot;default&quot;: &quot;Gold&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Mood&quot;, &quot;label&quot;: &quot;Palette temperature&quot; },\n  &quot;ambience&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Candlelit&quot;, &quot;Studio&quot;, &quot;Void&quot;], &quot;default&quot;: &quot;Candlelit&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Mood&quot;, &quot;label&quot;: &quot;Room ambience&quot; },\n  &quot;grain&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Mood&quot;, &quot;label&quot;: &quot;Analog film grain&quot; }\n}\">\nclass Component extends DCLogic {\n  cards = (typeof window !== 'undefined' && window.TTB_CARDS) ? window.TTB_CARDS : [];\n  suits = [['all', 'All'], ['Scenario', 'Scenarios'], ['Practice', 'Practices'], ['Values', 'Values'], ['Reflection', 'Reflections']];\n  tips = [\n    { t: 'Two faces, one truth', b: 'Every card holds a Toxic pattern and its Brave shift. Tap the card to flip between them.' },\n    { t: 'Readiness is set together', b: 'Before a group session, everyone anonymously picks how deep they\\u2019re ready to go. The group\\u2019s floor sets the starting depth \\u2014 and anyone can flag to keep it safe, anytime.' },\n    { t: 'Play your way', b: 'Draw, shuffle, or filter by suit. When a card lands, use it to start a real conversation with your team.' }\n  ];\n  state = { screen: 'cover', i: 0, side: 'toxic', heat: 0, filter: 'all', order: [], onbStep: , ...patch };\n    this.setState(patch);\n    this.persistNav(next);\n  }\n  go(screen) { this.setState({ screen }); }\n\n  loadAccounts() { try { return JSON.parse(localStorage.getItem('ttb_accounts') || '{}'); } catch (e) { return {}; } }\n  saveAccount(acc) { const all = this.loadAccounts(); all[acc.email] = acc; try { localStorage.setItem('ttb_accounts', JSON.stringify(all)); localStorage.setItem('ttb_session', acc.email); } catch (e) {} }\n\n  buildOrder(filter, shuffle) {\n    let idxs = this.cards.map((c, k) => k).filter(k => filter === 'all' || this.cards[k].type === filter);\n    if (shuffle) {\n      for (let j = idxs.length - 1; j > 0; j--) {\n        const r = Math.floor(Math.random() * (j + 1));\n        const t = idxs[j]; idxs[j] = idxs[r]; idxs[r] = t;\n      }\n    }\n    return idxs;\n  }\n\n  logCard() {\n    if (!this.state.account) return;\n    const card = this.cards[this.state.order[this.state.i]];\n    if (!card) return;\n    const acc = { ...this.state.account };\n    acc.cardsUsed = { ...(acc.cardsUsed || {}) };\n    acc.cardsUsed[card.id] = (acc.cardsUsed[card.id] || 0) + 1;\n    acc.recent = [card.id, ...((acc.recent || []).filter(x => x !== card.id))].slice(0, 12);\n    acc.lastCardId = card.id;\n    acc.explorations = (acc.explorations || 0) + 1;\n    this.saveAccount(acc);\n    this.setState({ account: acc });\n  }\n\n  goLogin() { this.go('login'); }\n  fillResearcherDemo() {\n    if (this.emailRef.current) this.emailRef.current.value = 'you@example.com';\n    if (this.nameRef.current) this.nameRef.current.value = 'Guest';\n    this.submitLogin();\n  }\n  submitLogin() {\n    const email = ((this.emailRef.current && this.emailRef.current.value) || '').trim().toLowerCase();\n    const nm = ((this.nameRef.current && this.nameRef.current.value) || '').trim();\n    if (!email || !/.+@.+\\..+/.test(email)) { this.setState({ loginError: true }); return; }\n    const all = this.loadAccounts();\n    const isDemo = email === 'you@example.com';\ pulseOpen = allSess.filter(x => x.kept === false).length;\n\n      // ---------- Cohort detail ----------\n      const c = cohorts.find(x => x.id === s.activeCohort);\n      if (c) {\n        const col = cohortColor(c), last = lastOf(c), first = firstOf(c);\n        base.coName = c.name; base.coCol = col;\n        base.coKindLabel = c.kind === 'demo' ? 'One-off room' : 'Intact team · ' + c.participants.length + ' people';\n        base.coGauge = last.gauge; base.coBand = this.gaugeBand(last.gauge); base.coBandColor = this.gaugeBandColor(last.gauge);\n        base.coDelta = ((last.gauge - first.gauge) >= 0 ? '+' : '') + (last.gauge - first.gauge);\n        base.coDeltaUp = (last.gauge - first.gauge) > 0;\n        base.coSpark = this.buildSpark(c.sessions, col);\n        base.coPhaseName = this.phaseNames[c.phaseIdx];\n        base.coArc = this.phaseNames.map((p, i) => ({ name: p, done: i <= c.phaseIdx, current: i === c.phaseIdx,\n          dotBg: i < c.phaseIdx ? col : i === c.phaseIdx ? col : 'rgba(201,162,75,.15)',\n          dotBorder: i === c.phaseIdx ? col : 'rgba(201,162,75,.25)',\n          textCol: i <= c.phaseIdx ? '#f3e3da' : '#6f6353' }));\n        base.coNextDue = c.nextDue;\n        base.coUnfinished = last.done < last.total;\n        base.coFinished = !(last.done < last.total);\n        base.coResume = () => this.resumeCohort(c.id);\n        base.coRunNext = () => this.runNextSession(c.id);\n        base.coTimeline = c.sessions.slice().reverse().map(x => ({\n          date: x.date, phase: x.phase, gauge: x.gauge, gaugeCol: this.gaugeBandColor(x.gauge),\n          cards: x.done + '/' + x.total,\n          commit: x.commit || '—',\n          hasCommit: !!x.commit,\n          keptLabel: x.kept === true ? 'Kept' : x.kept === false ? 'Open' : x.done < x.total ? 'In progress' : 'No commit',\n          keptCol: x.kept === true ? '#7fce9f' : x.kept === false ? '#d8b25f' : '#8a7d6a',\n          keptBg: x.kept === true ? 'rgba(42,111,60,.2)' : x.kept === false ? ' : 'rgba(201,162,75,.24)'\n      }));\n      base.leaveCanConfirm = !!s.leaveReason;\n      base.leaveCannotConfirm = !s.leaveReason;\n      base.confirmLeave = () => this.confirmLeave();\n      base.cancelLeave = () => this.cancelLeave();\n    } else {\n      base.exploredCount = 0; base.exploredLabel = 'cards explored'; base.partnersCount = 0; base.partnersLabel = 'conversations';\n      base.recentList = []; base.hasRecent = false; base.partnersList = []; base.hasPartners = false; base.noPartners = true;\n      base.sessionsCount = 0; base.cohortsCount = 0; base.exploreCount = 0; base.historyList = []; base.hasHistory = false;\n    }\n    const card = (this.cards.length && s.order.length) ? this.cards[s.order[s.i]] : null;\n    if (!card) {\n      return base;\n    }\n    const h = Math.max(0, Math.min(2, s.heat));\n    const readinessText = ['Level 1 \\u00b7 Team patterns only', 'Level 2 \\u00b7 Name it on this team', 'Level 3 \\u00b7 Direct impact, opt-in'][h];\n    const chips = this.suits.map(([key, label]) => {\n      const active = s.filter === key;\n      return {\n        key, label,\n        on: () => this.setFilter(key),\n        bg: active ? 'linear-gradient(180deg,#d4ad58,#bb8f3c)' : 'rgba(201,162,75,0.06)',\n        col: active ? '#1a1206' : '#b9a98f',\n        border: active ? '#c9a24b' : 'rgba(201,162,75,0.26)'\n      };\n    });\n    return {\n      ...base,\n      suit: this.prettyType(card.type),\n      theme: card.theme,\n      code: card.id,\n      tName: card.toxicName,\n      bName: card.braveName,\n      tBody: card.toxic.pattern,\n      bBody: card.brave.shift,\n      tQ: card.toxic.qs[h],\n      bQ: card.brave.qs[h],\n      tHasAction: !!(card.toxic.action && card.toxic.action.length),\n      bHasAction: !!(card.brave.action && card.brave.action.length),\n      tAction: card.toxic.action,\n      bAction: card.brave.action,\n      pep: Array.from({ length: h + 1 }, () => ({})),\n      heat: h,\n      thumb: ['11%', '50%', '89%'][h],\n
