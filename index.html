 300;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"Reo Sans\";\n  src: url(\"9804ec1e-a04e-4eae-883d-608366077a5c\") format(\"opentype\");\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"Reo Sans\";\n  src: url(\"fdaf814e-26b8-46a8-b7ce-45c44a186114\") format(\"opentype\");\n  font-weight: 700;\n  font-style: normal;\n  font-display: swap;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   COLORS\n   Five brand hues drawn from the overlapping-bars mark, each\n   with a 60% and 30% tint-on-white. Warm, inclusive, grounded.\n   ============================================================ */\n\n:root {\n  /* ---- Brand: Indigo (primary — steadiness, leadership) ---- */\n  --indigo-600: #494E87;   /* hover / pressed */\n  --indigo-500: #575DA1;   /* base */\n  --indigo-300: #9C9EC7;   /* 60% on white */\n  --indigo-100: #CDCEE3;   /* 30% on white */\n\n  /* ---- Brand: Rust (accent — warmth, call-to-action) ---- */\n  --rust-600:  #A8460F;    /* hover / pressed */\n  --rust-500:  #C6541C;    /* base */\n  --rust-300:  #DE9A7C;    /* 60% on white */\n  --rust-100:  #EECDBE;    /* 30% on white */\n\n  /* ---- Brand: Peach (energy, appetite, optimism) ---- */\n  --peach-500: #EEA76F;\n  --peach-300: #F3CCAA;\n  --peach-100: #F9E4D4;\n\n  /* ---- Brand: Sky (calm, breathing room, trust) ---- */\n  --sky-500:   #B6D4DF;\n  --sky-300:   #D4E6EC;\n  --sky-100:   #EAF2F5;\n\n  /* ---- Brand: Sage (growth, nourishment, renewal) ---- */\n  --sage-500:  #E6EDCE;\n  --sage-300:  #F0F4E1;\n  --sage-100:  #F8FAF0;\n\n  /* ---- Neutrals / ink (warm-leaning grey scale) ---- */\n  --ink-900:   #1A1A1C;    /* logo black / headings */\n  --ink-700:   #45464C;\n  --ink-500:   #6C6D74;\n  --ink-400:   #909199;\n  --ink-300:   #BDBEC4;\n  --ink-200:   #DDDEE2;\n  --ink-100:   #ECEDEF;\n\n  /* ---- Paper / canvas ---- */\n  --paper:        #FFFFFF;\n  --paper-warm:   #FBF8F3;   /* default page canvas — soft cream */\n  --paper-sunk:   #F4F0E9;   /* recessed wells, code, tracks */\n\n  /* ============================================================\n     SEMANTIC ALIASES — reference these in components, not raw hues\n     ============================================================ */\n\n  /* Brand / interactive */\n  --color-primary:        var(--indigo-500);\n  --color-primary-hover:  var(--indigo-600);\n  --color-primary-soft:   var(--indigo-100);\n  --color-on-primary:     #FFFFFF;\n\n  --color-accent:         var(--rust-500);\n  --color-accent-hover:   var(--rust-600);\n  --color-accent-soft:    var(--rust-100);\n  --color-on-accent:      #FFFFFF;\n\n  /* Text */\n  --text-strong:   var(--ink-900);\n  --text-body:     var(--ink-700);\n  --text-muted:    var(--ink-500);\n  --text-faint:    var(--ink-400);\n  --text-on-dark:  #FFFFFF;\n  --text-link:     var(--indigo-500);\n\n  /* Surfaces */\n  --surface-page:    var(--paper-warm);\n  --surface-card:    var(--paper);\n  --surface-raised:  var(--paper);\n  --surface-sunk:    var(--paper-sunk);\n  --surface-inverse: var(--ink-900);\n\n  /* Tinted section / fill surfaces */\n  --surface-indigo:  var(--indigo-100);\n  --surface-rust:    var(--rust-100);\n  --surface-peach:   var(--peach-100);\n  --surface-sky:     var(--sky-100);\n  --surface-sage:    var(--sage-100);\n\n  /* Borders / dividers */\n  --border-subtle:  var(--ink-200);\n  --border-strong:  var(--ink-300);\n  --border-focus:   var(--indigo-500);\n  --divider:        var(--ink-100);\n\n  /* Status (kept on-brand; derived from the palette) */\n  --color-success:  #5C8A4A;   /* deepened sage */\n  --color-success-soft: var(--sage-300);\n  --color-warning:  #C6541C;   /* rust doubles as warning */\n  --color-warning-soft: var(--peach-100);\n  --color-danger:   #B23A3A;\n  --color-danger-soft:  #F5DADA;\n  --color-info:     #4C8198;   /* deepened sky */\n  --color-info-soft: var(--sky-100);\n\n  /* Focus ring */\n  --ring: 0 0 0 3px color-mix(in srgb, var(--indigo-500) 35%, transparent);\n}\n<\u002Fstyle>\n<script src=\"f4ec588d-e516-481a-97ef-50938abcb6cb\"><\u002Fscript>\n<style>\n  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }\n  html,body{ margin:0; background:#0c0a09; }\n  .ttb-scroll{ scrollbar-width:none; }\n  .ttb-scroll::-webkit-scrollbar{ display:none; }\n  @keyframes ttbRise{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }\n  @keyframes ttbSpin{ to{ transform:rotate(360deg); } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"min-height:100vh; width:100%; background:{{ deskBg }}; display:flex; align-items:center; justify-content:center; font-family:'Reo Sans','Plus Jakarta Sans',sans-serif; padding:18px; transition:background .5s ease\">\n  <div style=\"position:relative; width:444px; max-width:100%; height:min(916px, calc(100vh - 36px)); display:flex; flex-direction:column; filter:{{ frameFilter }}; transition:filter .5s ease\">\n    <div style=\"position:absolute; inset:0; z-index:60; pointer-events:none; opacity:{{ grainOpacity }}; mix-blend-mode:overlay; transition:opacity .4s ease; background-image:url('data:image/svg+xml;utf8,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22160%22&gt;&lt;filter id=%22n%22&gt;&lt;feTurbulence type=%22fractalNoise%22 sc-camel-base-frequency=%220.85%22 sc-camel-num-octaves=%222%22 sc-camel-stitch-tiles=%22stitch%22/&gt;&lt;/filter&gt;&lt;rect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22/&gt;&lt;/svg&gt;'); background-size:160px 160px\"><\u002Fdiv>\n\n    <\u0021-- ============================ COVER ============================ -->\n    <sc-if value=\"{{ isCover }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px 34px\">\n        <div style=\"font:600 11.5px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.34em; text-transform:uppercase; color:#9c7e4e\">Conversation Cards for Teams<\u002Fdiv>\n\n        <div style=\"position:relative; width:150px; height:172px; margin:46px 0 40px\">\n          <div style=\"position:absolute; inset:0; border-radius:18px; background:radial-gradient(120% 110% at 50% 0%, #5e201b, #2a0d0a); border:1px solid rgba(201,162,75,.32); transform:rotate(-11deg) translateX(-20px); box-shadow:0 18px 40px -18px rgba(180,50,40,.6)\"><\u002Fdiv>\n          <div style=\"position:absolute; inset:0; border-radius:18px; background:radial-gradient(120% 110% at 50% 0%, #1c4430, #0a1f14); border:1px solid rgba(201,162,75,.32); transform:rotate(11deg) translateX(20px); box-shadow:0 18px 40px -18px rgba(40,150,100,.5)\"><\u002Fdiv>\n          <div style=\"position:absolute; inset:0; border-radius:18px; background:linear-gradient(160deg, #2a2018, #171109); border:1px solid rgba(201,162,75,.55); box-shadow:0 22px 48px -20px rgba(0,0,0,.8), inset 0 0 0 1px rgba(201,162,75,.12); display:flex; align-items:center; justify-content:center\">\n            <div style=\"font:600 60px/1 'Cormorant Garamond'; background:linear-gradient(180deg,#e8cd8f,#b98f3e); -webkit-background-clip:text; background-clip:text; color:transparent\">T→B<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font:600 54px/.98 'Cormorant Garamond'; color:#f3e8d6; letter-spacing:-.01em\">From Toxic<br>to Brave<\u002Fdiv>\n        <div style=\"font:400 16px/1.6 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; margin-top:20px; max-width:300px\" data-comment-anchor=\"fea8fae74f-div\">Change the conversation. Change the culture.<\u002Fdiv>\n\n        <div sc-camel-on-click=\"{{ goLogin }}\" style=\"margin-top:40px; cursor:pointer; background:linear-gradient(180deg,#d4ad58,#bb8f3c); color:#1a1206; font:600 15px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.02em; padding:17px 40px; border-radius:999px; box-shadow:0 14px 34px -12px rgba(201,162,75,.6)\" style-active=\"transform:scale(.97)\">Get started<\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <\u0021-- ============================ LOGIN ============================ -->\n    <sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1; display:flex; flex-direction:column; padding:24px 30px 30px\">\n        <div sc-camel-on-click=\"{{ goCover }}\" style=\"cursor:pointer; width:38px; height:38px; flex:0 0 auto; border-radius:50%; border:1px solid rgba(201,162,75,.28); display:flex; align-items:center; justify-content:center; color:#c9a24b; font-size:17px\" style-active=\"transform:scale(.94)\">‹<\u002Fdiv>\n        <div style=\"flex:1; display:flex; flex-direction:column; justify-content:center; max-width:344px; width:100%; margin:0 auto\">\n          <div style=\"font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.3em; text-transform:uppercase; color:#9c7e4e\">Your account<\u002Fdiv>\n          <div style=\"font:600 44px/1 'Cormorant Garamond'; color:#f3e8d6; margin-top:14px\">Sign in to play<\u002Fdiv>\n          <div style=\"font:400 14.5px/1.6 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; margin-top:14px\">Your email saves your progress — the cards you've used and the conversations you've had — across sessions.<\u002Fdiv>\n\n          <div style=\"font:600 10.5px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.16em; text-transform:uppercase; color:#8a7d6a; margin:26px 0 8px\">Email<\u002Fdiv>\n          <input ref=\"{{ emailRef }}\" type=\"email\" inputmode=\"email\" placeholder=\"you@team.com\" style=\"width:100%; background:rgba(201,162,75,.06); border:1px solid rgba(201,162,75,.3); border-radius:13px; padding:15px 16px; color:#f3e8d6; font:400 15px/1 'Reo Sans','Plus Jakarta Sans'; outline:none\" style-focus=\"border-color:#d8b25f\">\n\n          <div style=\"font:600 10.5px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.16em; text-transform:uppercase; color:#8a7d6a; margin:18px 0 8px\">First name <span style=\"color:#6f6353; text-transform:none; letter-spacing:0; font-weight:500\">· first time only<\u002Fspan><\u002Fdiv>\n          <input ref=\"{{ nameRef }}\" type=\"text\" placeholder=\"Jordan\" style=\"width:100%; background:rgba(201,162,75,.06); border:1px solid rgba(201,162,75,.3); border-radius:13px; padding:15px 16px; color:#f3e8d6; font:400 15px/1 'Reo Sans','Plus Jakarta Sans'; outline:none\" style-focus=\"border-color:#d8b25f\">\n\n          <sc-if value=\"{{ loginError }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font:500 13px/1.4 'Reo Sans','Plus Jakarta Sans'; color:#e0735c; margin-top:14px\">Enter a valid email to continue.<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div sc-camel-on-click=\"{{ submitLogin }}\" style=\"margin-top:24px; cursor:pointer; text-align:center; background:linear-gradient(180deg,#d4ad58,#bb8f3c); color:#1a1206; font:600 15px/1 'Reo Sans','Plus Jakarta Sans'; padding:17px; border-radius:999px; box-shadow:0 14px 34px -14px rgba(201,162,75,.55)\" style-active=\"transform:scale(.98)\">Continue<\u002Fdiv>\n          <div style=\"text-align:center; font:500 11px/1.5 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.04em; color:#6f6353; margin-top:16px\" data-comment-anchor=\"0e247af1e8-div\">Your data stays on this device.<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ fillResearcherDemo }}\" style=\"cursor:pointer; margin-top:18px; text-align:center; background:rgba(143,179,224,.08); border:1px solid rgba(143,179,224,.28); border-radius:12px; padding:11px 12px\" style-active=\"transform:scale(.98)\">\n            <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.16em; text-transform:uppercase; color:#8fb3e0\">Researcher demo<\u002Fdiv>\n            <div style=\"font:400 12px/1.4 'Reo Sans','Plus Jakarta Sans'; color:#9fb4cf; margin-top:5px\">Tap to fill you@example.com · Guest<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <\u0021-- ============================ ONBOARDING ============================ -->\n    <sc-if value=\"{{ isOnboard }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1; display:flex; flex-direction:column; padding:24px 30px 30px\">\n        <div style=\"display:flex; justify-content:space-between; align-items:center\">\n          <div style=\"font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.16em; text-transform:uppercase; color:#8a7d6a\">{{ obStepNum }}<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ skipOnb }}\" style=\"cursor:pointer; font:600 12px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.06em; color:#9c7e4e\">Skip ›<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1; display:flex; flex-direction:column; justify-content:center; text-align:center; max-width:330px; margin:0 auto\">\n          <div style=\"width:96px; height:112px; margin:0 auto 36px; position:relative\">\n            <div style=\"position:absolute; inset:0; border-radius:14px; background:radial-gradient(120% 110% at 50% 0%, #5e201b, #2a0d0a); border:1px solid rgba(201,162,75,.3); transform:rotate(-9deg) translateX(-10px)\"><\u002Fdiv>\n            <div style=\"position:absolute; inset:0; border-radius:14px; background:radial-gradient(120% 110% at 50% 0%, #1c4430, #0a1f14); border:1px solid rgba(201,162,75,.3); transform:rotate(9deg) translateX(10px)\"><\u002Fdiv>\n            <div style=\"position:absolute; inset:0; border-radius:14px; background:linear-gradient(160deg,#2a2018,#171109); border:1px solid rgba(201,162,75,.5); display:flex; align-items:center; justify-content:center; font:600 32px/1 'Cormorant Garamond'; color:#e0bd72\">{{ obStepNum2 }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font:500 11px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.24em; text-transform:uppercase; color:#9c7e4e\">Welcome, {{ greeting }}<\u002Fdiv>\n          <div style=\"font:600 38px/1.04 'Cormorant Garamond'; color:#f3e8d6; margin-top:14px\">{{ obTitle }}<\u002Fdiv>\n          <div style=\"font:400 15.5px/1.6 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; margin-top:14px\">{{ obBody }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:center; justify-content:center; gap:7px; margin-bottom:22px\">\n          <sc-for list=\"{{ obDots }}\" as=\"d\" hint-placeholder-count=\"3\"><div style=\"width:{{ d.w }}; height:7px; border-radius:4px; background:{{ d.bg }}; transition:all .25s ease\"><\u002Fdiv><\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:12px\">\n          <div sc-camel-on-click=\"{{ onbBack }}\" style=\"cursor:pointer; width:56px; height:54px; flex:0 0 auto; border-radius:999px; border:1px solid rgba(201,162,75,.3); display:flex; align-items:center; justify-content:center; color:#d8b25f; font-size:20px\" style-active=\"transform:scale(.96)\">‹<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ onbNext }}\" style=\"cursor:pointer; flex:1; height:54px; border-radius:999px; background:linear-gradient(180deg,#d4ad58,#bb8f3c); color:#1a1206; display:flex; align-items:center; justify-content:center; font:600 14px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.02em\" style-active=\"transform:scale(.98)\">{{ obNextLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <\u0021-- ============================ HOME ============================ -->\n    <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"ttb-scroll\" style=\"flex:1; display:flex; flex-direction:column; padding:24px 26px 28px; overflow-y:auto\">\n        <div style=\"display:flex; justify-content:space-between; align-items:center; flex:0 0 auto\">\n          <div style=\"font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.28em; text-transform:uppercase; color:#9c7e4e\">From Toxic to Brave<\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:12px\">\n            <div sc-camel-on-click=\"{{ toggleRole }}\" style=\"cursor:pointer; display:flex; align-items:center; gap:6px; background:rgba(143,179,224,.1); border:1px solid rgba(143,179,224,.3); border-radius:999px; padding:6px 11px\" style-active=\"transform:scale(.95)\">\n              <div style=\"width:6px; height:6px; border-radius:50%; background:#8fb3e0\"><\u002Fdiv>\n              <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.08em; text-transform:uppercase; color:#9fb4cf\">{{ roleLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div sc-camel-on-click=\"{{ goGuide }}\" style=\"cursor:pointer; font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.08em; text-transform:uppercase; color:#9c7e4e\">Guide<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ signOut }}\" style=\"cursor:pointer; font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.08em; text-transform:uppercase; color:#7a6e5c\">Sign out<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font:500 11px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.2em; text-transform:uppercase; color:#9c7e4e; margin-top:30px\">Welcome back<\u002Fdiv>\n        <div style=\"font:600 46px/1 'Cormorant Garamond'; color:#f3e8d6; margin-top:8px\">{{ greeting }}<\u002Fdiv>\n        <div style=\"font:400 14.5px/1.55 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; margin-top:10px\">Here's how your teams are moving.<\u002Fdiv>\n\n        <div style=\"display:flex; gap:10px; margin-top:22px\">\n          <div style=\"flex:1; background:rgba(201,162,75,.06); border:1px solid rgba(201,162,75,.22); border-radius:16px; padding:14px 11px\">\n            <div style=\"font:600 28px/1 'Cormorant Garamond'; color:#e0bd72\">{{ pulseCohorts }}<\u002Fdiv>\n            <div style=\"font:500 9.5px/1.25 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.04em; text-transform:uppercase; color:#8a7d6a; margin-top:6px\">Active cohorts<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1; background:rgba(127,206,159,.07); border:1px solid rgba(127,206,159,.24); border-radius:16px; padding:14px 11px\">\n            <div style=\"font:600 28px/1 'Cormorant Garamond'; color:#7fce9f\">{{ pulseShift }}<\u002Fdiv>\n            <div style=\"font:500 9.5px/1.25 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.04em; text-transform:uppercase; color:#8a7d6a; margin-top:6px\">Avg culture shift<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1; background:rgba(201,162,75,.06); border:1px solid rgba(201,162,75,.22); border-radius:16px; padding:14px 11px\">\n            <div style=\"font:600 28px/1 'Cormorant Garamond'; color:#e0bd72\">{{ pulseOpen }}<\u002Fdiv>\n            <div style=\"font:500 9.5px/1.25 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.04em; text-transform:uppercase; color:#8a7d6a; margin-top:6px\">Open commitments<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div sc-camel-on-click=\"{{ startFacilitation }}\" style=\"margin-top:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:9px; background:linear-gradient(180deg,#d4ad58,#bb8f3c); color:#1a1206; font:600 15px/1 'Reo Sans','Plus Jakarta Sans'; padding:17px; border-radius:16px; box-shadow:0 14px 34px -14px rgba(201,162,75,.55)\" style-active=\"transform:scale(.98)\">\n          <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\" stroke=\"#1a1206\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"4\" stroke=\"#1a1206\" stroke-width=\"2\"><\u002Fcircle><path d=\"M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\" stroke=\"#1a1206\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          Facilitate a session\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:10px; margin-top:10px\">\n          <div sc-camel-on-click=\"{{ continuePlay }}\" style=\"flex:1; cursor:pointer; text-align:center; background:rgba(201,162,75,.08); border:1px solid rgba(201,162,75,.3); color:#e0bd72; font:600 13px/1 'Reo Sans','Plus Jakarta Sans'; padding:14px 6px; border-radius:14px\" style-active=\"transform:scale(.98)\">Solo play<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ joinSession }}\" style=\"flex:1; cursor:pointer; text-align:center; background:rgba(201,162,75,.08); border:1px solid rgba(201,162,75,.3); color:#e0bd72; font:600 13px/1 'Reo Sans','Plus Jakarta Sans'; padding:14px 6px; border-radius:14px\" style-active=\"transform:scale(.98)\">Join a session<\u002Fdiv>\n        <\u002Fdiv>\n\n        <\u0021-- RESUME -->\n        <sc-if value=\"{{ hasResume }}\" hint-placeholder-val=\"{{ false }}\">\n          <div sc-camel-on-click=\"{{ resume.on }}\" style=\"cursor:pointer; margin-top:16px; background:radial-gradient(130% 120% at 0% 0%, rgba(201,162,75,.16), rgba(201,162,75,.05)); border:1px solid rgba(201,162,75,.4); border-radius:16px; padding:15px 16px\" style-active=\"transform:scale(.99)\">\n            <div style=\"display:flex; align-items:center; justify-content:space-between\">\n              <div style=\"font:600 9.5px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.18em; text-transform:uppercase; color:#d8b25f\">Pick up where you left off<\u002Fdiv>\n              <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; color:#8a7d6a\">{{ resume.progress }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; align-items:center; justify-content:space-between; margin-top:10px; gap:12px\">\n              <div style=\"min-width:0\">\n                <div style=\"font:600 22px/1.1 'Cormorant Garamond'; color:#f3e8d6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis\">{{ resume.name }}<\u002Fdiv>\n                <div style=\"font:500 12px/1.2 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; margin-top:3px\">{{ resume.label }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:0 0 auto; display:flex; align-items:center; gap:7px; background:linear-gradient(180deg,#d4ad58,#bb8f3c); color:#1a1206; font:600 13px/1 'Reo Sans','Plus Jakarta Sans'; padding:12px 18px; border-radius:999px\">Resume →<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"height:5px; border-radius:3px; background:rgba(201,162,75,.14); margin-top:12px; overflow:hidden\"><div style=\"height:100%; width:{{ resume.pct }}; background:linear-gradient(90deg,#bb8f3c,#e0bd72); border-radius:3px\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <\u0021-- COHORTS -->\n        <div style=\"display:flex; align-items:center; justify-content:space-between; margin:28px 0 12px\">\n          <div style=\"font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.18em; text-transform:uppercase; color:#9c7e4e\">Your cohorts<\u002Fdiv>\n          <div style=\"font:500 10px/1 'Reo Sans','Plus Jakarta Sans'; color:#6f6353\">Tap to open · swipe to leave<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:9px\">\n          <sc-for list=\"{{ cohortCards }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"position:relative; border-radius:15px; overflow:hidden\">\n              <div sc-camel-on-click=\"{{ c.onLeave }}\" style=\"position:absolute; right:0; top:0; bottom:0; width:96px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; cursor:pointer; background:linear-gradient(180deg,#7a2a20,#5e201b)\" style-active=\"opacity:.85\">\n                <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4\" stroke=\"#f3d9c9\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M16 17l5-5-5-5M21 12H9\" stroke=\"#f3d9c9\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.06em; color:#f3d9c9\">Leave<\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-pointer-down=\"{{ c.onDown }}\" sc-camel-on-pointer-move=\"{{ c.onMove }}\" sc-camel-on-pointer-up=\"{{ c.onUp }}\" sc-camel-on-pointer-cancel=\"{{ c.onUp }}\" style=\"position:relative; cursor:pointer; touch-action:pan-y; transform:{{ c.translate }}; transition:{{ c.cardTransition }}; background:linear-gradient(rgba(201,162,75,.05),rgba(201,162,75,.05)), #100c0a; border:1px solid rgba(201,162,75,.18); border-radius:15px; padding:14px 15px\">\n              <div style=\"display:flex; align-items:flex-start; justify-content:space-between; gap:10px\">\n                <div style=\"min-width:0; flex:1\">\n                  <div style=\"display:flex; align-items:center; gap:8px\">\n                    <div style=\"width:8px; height:8px; border-radius:2px; background:{{ c.col }}; flex:0 0 auto\"><\u002Fdiv>\n                    <div style=\"font:600 18px/1.1 'Cormorant Garamond'; color:#f3e3da; white-space:nowrap; overflow:hidden; text-overflow:ellipsis\">{{ c.name }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font:500 11.5px/1.2 'Reo Sans','Plus Jakarta Sans'; color:#8a7d6a; margin-top:5px\">{{ c.sessionLabel }} · {{ c.lastActive }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:0 0 auto; text-align:right\">\n                  <div style=\"display:flex; align-items:baseline; gap:5px; justify-content:flex-end\">\n                    <div style=\"font:600 24px/1 'Cormorant Garamond'; color:{{ c.bandColor }}\">{{ c.gauge }}<\u002Fdiv>\n                    <div style=\"font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; color:{{ c.deltaCol }}\">{{ c.deltaStr }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font:500 8.5px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.1em; text-transform:uppercase; color:#8a7d6a; margin-top:4px\">{{ c.band }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex; align-items:center; justify-content:space-between; margin-top:12px\">\n                <div style=\"display:flex; align-items:center\">\n                  <sc-for list=\"{{ c.avatars }}\" as=\"a\" hint-placeholder-count=\"4\">\n                    <div style=\"width:24px; height:24px; margin-right:-7px; border-radius:50%; background:#241a14; border:1.5px solid #0c0a09; box-shadow:0 0 0 1px rgba(201,162,75,.3); display:flex; align-items:center; justify-content:center; font:600 10px/1 'Cormorant Garamond'; color:#e0bd72\">{{ a.initial }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                  <sc-if value=\"{{ c.hasExtra }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"margin-left:12px; font:500 10.5px/1 'Reo Sans','Plus Jakarta Sans'; color:#8a7d6a\">{{ c.extraLabel }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"opacity:.9\">{{ c.spark }}<\u002Fdiv>\n              <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <\u0021-- ============================ GUIDE ============================ -->\n    <sc-if value=\"{{ isGuide }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"ttb-scroll\" style=\"flex:1; display:flex; flex-direction:column; padding:22px 26px 32px; overflow-y:auto\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; flex:0 0 auto\">\n          <div sc-camel-on-click=\"{{ goHome }}\" style=\"cursor:pointer; width:38px; height:38px; border-radius:50%; border:1px solid rgba(201,162,75,.28); display:flex; align-items:center; justify-content:center; color:#c9a24b; font-size:17px\" style-active=\"transform:scale(.94)\">‹<\u002Fdiv>\n          <div style=\"font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.28em; text-transform:uppercase; color:#9c7e4e\">Facilitator's Guide<\u002Fdiv>\n          <div style=\"width:38px\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.24em; text-transform:uppercase; color:#9c7e4e; margin-top:28px\">What this is<\u002Fdiv>\n        <div style=\"font:600 34px/1.06 'Cormorant Garamond'; color:#f3e8d6; margin-top:10px\">A deck for conversations teams avoid.<\u002Fdiv>\n        <div style=\"font:400 14.5px/1.65 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; margin-top:12px\">From Toxic to Brave helps teams move from naming a destructive pattern to designing a structural shift. Each card pair shows the toxic face of a dynamic and its brave alternative. Your role is to create the conditions for honest inquiry — not to solve the problem, but to name it together.<\u002Fdiv>\n\n        <div style=\"height:1px; background:rgba(201,162,75,.18); margin:24px 0\"><\u002Fdiv>\n        <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.24em; text-transform:uppercase; color:#9c7e4e\">The four suits<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:9px; margin-top:14px\">\n          <div style=\"display:flex; gap:14px; align-items:flex-start; background:radial-gradient(120% 110% at 50% 0%, #3d1712, #22100d); border:1px solid rgba(201,162,75,.28); border-radius:16px; padding:15px 15px\">\n            <div style=\"flex:0 0 auto; font:600 28px/1 'Cormorant Garamond'; color:#e0bd72; width:30px\">S<\u002Fdiv>\n            <div><div style=\"font:600 15px/1 'Cormorant Garamond'; color:#f3e3da\">Scenarios<\u002Fdiv><div style=\"font:400 13px/1.5 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; margin-top:5px\">Vivid team situations. Name a pattern in the room. Start here with newer groups or when trust is still forming.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:14px; align-items:flex-start; background:rgba(201,162,75,.05); border:1px solid rgba(201,162,75,.18); border-radius:16px; padding:15px 15px\">\n            <div style=\"flex:0 0 auto; font:600 28px/1 'Cormorant Garamond'; color:#e0bd72; width:30px\">R<\u002Fdiv>\n            <div><div style=\"font:600 15px/1 'Cormorant Garamond'; color:#f3e3da\">Reflections<\u002Fdiv><div style=\"font:400 13px/1.5 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; margin-top:5px\">Personal memory prompts. Go deeper after trust is established. The three heat levels are most meaningful here.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:14px; align-items:flex-start; background:rgba(201,162,75,.05); border:1px solid rgba(201,162,75,.18); border-radius:16px; padding:15px 15px\">\n            <div style=\"flex:0 0 auto; font:600 28px/1 'Cormorant Garamond'; color:#e0bd72; width:30px\">V<\u002Fdiv>\n            <div><div style=\"font:600 15px/1 'Cormorant Garamond'; color:#f3e3da\">Values<\u002Fdiv><div style=\"font:400 13px/1.5 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; margin-top:5px\">The big frames — what a team says vs. what it does. Best for culture diagnosis. Often the most charged cards.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:14px; align-items:flex-start; background:radial-gradient(120% 110% at 50% 0%, #0e3422, #091a12); border:1px solid rgba(201,162,75,.28); border-radius:16px; padding:15px 15px\">\n            <div style=\"flex:0 0 auto; font:600 28px/1 'Cormorant Garamond'; color:#e0bd72; width:30px\">P<\u002Fdiv>\n            <div><div style=\"font:600 15px/1 'Cormorant Garamond'; color:#f3e3da\">Practices<\u002Fdiv><div style=\"font:400 13px/1.5 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; margin-top:5px\">Structural interventions — things teams can actually change. Use to close a session with a real committed shift.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"height:1px; background:rgba(201,162,75,.18); margin:24px 0\"><\u002Fdiv>\n        <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.24em; text-transform:uppercase; color:#9c7e4e\">The readiness dial<\u002Fdiv>\n        <div style=\"font:600 30px/1.06 'Cormorant Garamond'; color:#f3e8d6; margin-top:10px\">Safe · Honest · Real<\u002Fdiv>\n        <div style=\"font:400 14px/1.65 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; margin-top:10px\">The three heat levels move questions from general observation to personal disclosure. <strong style=\"color:#e7dccb; font-weight:600\">Safe<\u002Fstrong> — observe the pattern (any group, first session). <strong style=\"color:#e7dccb; font-weight:600\">Honest<\u002Fstrong> — name it on this team. <strong style=\"color:#e7dccb; font-weight:600\">Real<\u002Fstrong> — make it personal (high trust only). Let the group tell you where they are — don't push past readiness.<\u002Fdiv>\n\n        <div style=\"height:1px; background:rgba(201,162,75,.18); margin:24px 0\"><\u002Fdiv>\n        <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.24em; text-transform:uppercase; color:#9c7e4e\">Session flow<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:10px; margin-top:14px\">\n          <div style=\"display:flex; gap:12px; align-items:flex-start\">\n            <div style=\"flex:0 0 auto; width:28px; height:28px; border-radius:50%; border:1.5px solid rgba(201,162,75,.45); display:flex; align-items:center; justify-content:center; font:600 11px/1 'Cormorant Garamond'; color:#c9a24b\">1<\u002Fdiv>\n            <div><div style=\"font:600 15px/1 'Cormorant Garamond'; color:#f3e3da; margin-top:5px\">Discover<\u002Fdiv><div style=\"font:400 13px/1.55 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; margin-top:4px\">Pull a Scenarios or Values card. Read the Toxic face. Ask Q1 (Safe). Name the pattern without blame.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:12px; align-items:flex-start\">\n            <div style=\"flex:0 0 auto; width:28px; height:28px; border-radius:50%; border:1.5px solid rgba(201,162,75,.45); display:flex; align-items:center; justify-content:center; font:600 11px/1 'Cormorant Garamond'; color:#c9a24b\">2<\u002Fdiv>\n            <div><div style=\"font:600 15px/1 'Cormorant Garamond'; color:#f3e3da; margin-top:5px\">Dream<\u002Fdiv><div style=\"font:400 13px/1.55 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; margin-top:4px\">Flip to Brave. Read the Shift. Ask Q1–Q2. What becomes possible when the pattern breaks?<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:12px; align-items:flex-start\">\n            <div style=\"flex:0 0 auto; width:28px; height:28px; border-radius:50%; border:1.5px solid rgba(201,162,75,.45); display:flex; align-items:center; justify-content:center; font:600 11px/1 'Cormorant Garamond'; color:#c9a24b\">3<\u002Fdiv>\n            <div><div style=\"font:600 15px/1 'Cormorant Garamond'; color:#f3e3da; margin-top:5px\">Design<\u002Fdiv><div style=\"font:400 13px/1.55 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; margin-top:4px\">Move to Honest or Real. Ask Q2–Q3. Name one structural shift this team could actually make.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:12px; align-items:flex-start\">\n            <div style=\"flex:0 0 auto; width:28px; height:28px; border-radius:50%; border:1.5px solid rgba(201,162,75,.45); display:flex; align-items:center; justify-content:center; font:600 11px/1 'Cormorant Garamond'; color:#c9a24b\">4<\u002Fdiv>\n            <div><div style=\"font:600 15px/1 'Cormorant Garamond'; color:#f3e3da; margin-top:5px\">Destiny<\u002Fdiv><div style=\"font:400 13px/1.55 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; margin-top:4px\">Pull a Practices card. Read \"Think about this.\" Team names one person, one action, one week.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"height:1px; background:rgba(201,162,75,.18); margin:24px 0\"><\u002Fdiv>\n        <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.24em; text-transform:uppercase; color:#9c7e4e\">Facilitator tips<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:9px; margin-top:14px\">\n          <div style=\"font:400 13.5px/1.6 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; padding-left:14px; border-left:2px solid rgba(201,162,75,.35)\">Give silence. Ask the question, then wait 20–30 seconds before calling on someone. Silence means people are thinking.<\u002Fdiv>\n          <div style=\"font:400 13.5px/1.6 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; padding-left:14px; border-left:2px solid rgba(201,162,75,.35)\">Redirect blame. If it becomes venting, ask \"What does this pattern protect?\" rather than \"Who is responsible?\"<\u002Fdiv>\n          <div style=\"font:400 13.5px/1.6 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; padding-left:14px; border-left:2px solid rgba(201,162,75,.35)\">Listen for patterns, not complaints. Synthesize: \"What I'm hearing is…\" — name the dynamic, not the person.<\u002Fdiv>\n          <div style=\"font:400 13.5px/1.6 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; padding-left:14px; border-left:2px solid rgba(201,162,75,.35)\">Watch quieter voices. Invite directly: \"What are you noticing?\" — especially before flipping to Brave.<\u002Fdiv>\n          <div style=\"font:400 13.5px/1.6 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; padding-left:14px; border-left:2px solid rgba(201,162,75,.35)\">End with one thing. One card, one committed shift, one week. That's a brave conversation.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"height:1px; background:rgba(201,162,75,.18); margin:24px 0\"><\u002Fdiv>\n        <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.24em; text-transform:uppercase; color:#9c7e4e\">Timing<\u002Fdiv>\n        <div style=\"display:flex; gap:10px; margin-top:14px\">\n          <div style=\"flex:1; background:rgba(201,162,75,.06); border:1px solid rgba(201,162,75,.2); border-radius:14px; padding:13px 11px\">\n            <div style=\"font:600 22px/1 'Cormorant Garamond'; color:#e0bd72\">30<\u002Fdiv>\n            <div style=\"font:600 9px/1.25 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.04em; text-transform:uppercase; color:#8a7d6a; margin-top:5px\">Min · Quick<\u002Fdiv>\n            <div style=\"font:400 12px/1.5 'Reo Sans','Plus Jakarta Sans'; color:#8a7d6a; margin-top:6px\">1 card, Safe level, Scenarios only.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1; background:rgba(201,162,75,.06); border:1px solid rgba(201,162,75,.2); border-radius:14px; padding:13px 11px\">\n            <div style=\"font:600 22px/1 'Cormorant Garamond'; color:#e0bd72\">60<\u002Fdiv>\n            <div style=\"font:600 9px/1.25 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.04em; text-transform:uppercase; color:#8a7d6a; margin-top:5px\">Min · Standard<\u002Fdiv>\n            <div style=\"font:400 12px/1.5 'Reo Sans','Plus Jakarta Sans'; color:#8a7d6a; margin-top:6px\">2–3 cards, D→D→D→D flow, mix suits.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1; background:rgba(201,162,75,.06); border:1px solid rgba(201,162,75,.2); border-radius:14px; padding:13px 11px\">\n            <div style=\"font:600 22px/1 'Cormorant Garamond'; color:#e0bd72\">90<\u002Fdiv>\n            <div style=\"font:600 9px/1.25 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.04em; text-transform:uppercase; color:#8a7d6a; margin-top:5px\">Min · Deep<\u002Fdiv>\n            <div style=\"font:400 12px/1.5 'Reo Sans','Plus Jakarta Sans'; color:#8a7d6a; margin-top:6px\">4–6 cards, Real level, Practices close.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <\u0021-- ============================ LOBBY ============================ -->\n    <sc-if value=\"{{ isLobby }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"ttb-scroll\" style=\"flex:1; display:flex; flex-direction:column; padding:22px 26px 26px; overflow-y:auto\">\n        <div style=\"display:flex; justify-content:space-between; align-items:center; flex:0 0 auto\">\n          <div sc-camel-on-click=\"{{ leaveLive }}\" style=\"cursor:pointer; width:38px; height:38px; flex:0 0 auto; border-radius:50%; border:1px solid rgba(201,162,75,.28); display:flex; align-items:center; justify-content:center; color:#c9a24b; font-size:17px\" style-active=\"transform:scale(.94)\">‹<\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:7px; font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.2em; text-transform:uppercase; color:#e0735c\"><span style=\"width:7px; height:7px; border-radius:50%; background:#e0735c; box-shadow:0 0 8px #e0735c\"><\u002Fspan>Live room<\u002Fdiv>\n          <div style=\"width:38px\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"text-align:center; margin-top:16px; flex:0 0 auto\">\n          <div style=\"font:600 10.5px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.2em; text-transform:uppercase; color:#9c7e4e\">Join at toxic-to-brave.app<\u002Fdiv>\n          <div style=\"font:600 58px/1 'Cormorant Garamond'; color:#f3e8d6; letter-spacing:.04em; margin-top:10px\">{{ roomPin }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"align-self:center; margin-top:16px; width:120px; height:120px; flex:0 0 auto; border-radius:16px; background:#f3ead6; padding:11px; box-shadow:0 0 40px -16px rgba(201,162,75,.5)\">\n          <svg sc-camel-view-box=\"0 0 100 100\" width=\"100%\" height=\"100%\" shape-rendering=\"crispEdges\"><rect width=\"100\" height=\"100\" fill=\"#f3ead6\"><\u002Frect><path d=\"M8 8h26v26h-26z M14 14h14v14h-14z M66 8h26v26h-26z M72 14h14v14h-14z M8 66h26v26h-26z M14 72h14v14h-14z\" fill=\"#1c1409\"><\u002Fpath><path d=\"M42 8h6v6h-6z M54 8h6v6h-6z M42 20h6v6h-6z M60 42h6v6h-6z M42 48h6v6h-6z M74 48h6v6h-6z M88 54h6v6h-6z M42 60h6v6h-6z M54 54h6v6h-6z M68 62h6v6h-6z M82 68h6v6h-6z M48 74h6v6h-6z M60 74h6v6h-6z M72 80h6v6h-6z M88 80h6v6h-6z M54 88h6v6h-6z M66 88h6v6h-6z M42 88h6v6h-6z\" fill=\"#1c1409\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n\n        <div style=\"font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.16em; text-transform:uppercase; color:#9c7e4e; margin:24px 0 0; text-align:center; flex:0 0 auto\">{{ teamCountLabel }}<\u002Fdiv>\n\n        <div style=\"display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px; min-height:34px; flex:0 0 auto\">\n          <sc-for list=\"{{ teamsList }}\" as=\"t\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex; align-items:center; gap:8px; background:rgba(201,162,75,.1); border:1px solid rgba(201,162,75,.34); border-radius:999px; padding:7px 14px 7px 7px\">\n              <div style=\"width:22px; height:22px; border-radius:50%; background:linear-gradient(180deg,#e0bd72,#c19a44); display:flex; align-items:center; justify-content:center; font:600 11px/1 'Cormorant Garamond'; color:#1c0c0a\">{{ t.initial }}<\u002Fdiv>\n              <div style=\"font:500 13px/1 'Reo Sans','Plus Jakarta Sans'; color:#f3e3da\">{{ t.name }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div sc-camel-on-click=\"{{ addTeam }}\" style=\"align-self:center; margin-top:16px; flex:0 0 auto; cursor:pointer; font:600 10.5px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.06em; text-transform:uppercase; color:#7a6e5c; border:1px dashed rgba(201,162,75,.3); border-radius:999px; padding:9px 16px\" style-active=\"transform:scale(.97)\">+ Simulate a team joining<\u002Fdiv>\n\n        <div style=\"flex:1; min-height:16px\"><\u002Fdiv>\n\n        <input ref=\"{{ roomNameRef }}\" type=\"text\" placeholder=\"Name this cohort (optional)\" style=\"width:100%; flex:0 0 auto; background:rgba(201,162,75,.06); border:1px solid rgba(201,162,75,.3); border-radius:13px; padding:13px 15px; color:#f3e8d6; font:400 14px/1 'Reo Sans','Plus Jakarta Sans'; outline:none\" style-focus=\"border-color:#d8b25f\">\n        <div sc-camel-on-click=\"{{ commence }}\" style=\"margin-top:12px; flex:0 0 auto; cursor:pointer; text-align:center; background:{{ commenceBg }}; color:{{ commenceCol }}; border:1px solid rgba(201,162,75,.3); font:600 15px/1 'Reo Sans','Plus Jakarta Sans'; padding:17px; border-radius:999px; transition:all .2s ease\" style-active=\"transform:scale(.98)\">Commence dialogue<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <\u0021-- ============================ JOIN ============================ -->\n    <sc-if value=\"{{ isJoin }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1; display:flex; flex-direction:column; padding:24px 30px 30px\">\n        <div sc-camel-on-click=\"{{ goHome }}\" style=\"cursor:pointer; width:38px; height:38px; flex:0 0 auto; border-radius:50%; border:1px solid rgba(201,162,75,.28); display:flex; align-items:center; justify-content:center; color:#c9a24b; font-size:17px\" style-active=\"transform:scale(.94)\">‹<\u002Fdiv>\n        <sc-if value=\"{{ joinIdle }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"flex:1; display:flex; flex-direction:column; justify-content:center; max-width:330px; width:100%; margin:0 auto\">\n            <div style=\"font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.3em; text-transform:uppercase; color:#9c7e4e\">Join a session<\u002Fdiv>\n            <div style=\"font:600 44px/1.02 'Cormorant Garamond'; color:#f3e8d6; margin-top:14px\">Enter the room PIN<\u002Fdiv>\n            <div style=\"font:400 14.5px/1.6 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; margin-top:14px\">Your host is sharing a 6-digit PIN on the main screen.<\u002Fdiv>\n            <input ref=\"{{ joinPinRef }}\" type=\"text\" inputmode=\"numeric\" placeholder=\"000-000\" style=\"width:100%; text-align:center; letter-spacing:.18em; background:rgba(201,162,75,.06); border:1px solid rgba(201,162,75,.3); border-radius:13px; padding:18px 16px; color:#f3e8d6; font:600 26px/1 'Cormorant Garamond'; outline:none; margin-top:22px\" style-focus=\"border-color:#d8b25f\">\n            <sc-if value=\"{{ joinError }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font:500 13px/1.4 'Reo Sans','Plus Jakarta Sans'; color:#e0735c; margin-top:12px\">Enter the PIN from your host's screen.<\u002Fdiv>\n            <\u002Fsc-if>\n            <div sc-camel-on-click=\"{{ submitJoin }}\" style=\"margin-top:20px; cursor:pointer; text-align:center; background:linear-gradient(180deg,#d4ad58,#bb8f3c); color:#1a1206; font:600 15px/1 'Reo Sans','Plus Jakarta Sans'; padding:17px; border-radius:999px; box-shadow:0 14px 34px -14px rgba(201,162,75,.55)\" style-active=\"transform:scale(.98)\">Join<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ joinWaiting }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; max-width:300px; margin:0 auto\">\n            <div style=\"width:66px; height:66px; border-radius:50%; border:2px solid rgba(201,162,75,.25); border-top-color:#d8b25f; animation:ttbSpin 1s linear infinite\"><\u002Fdiv>\n            <div style=\"font:600 30px/1.1 'Cormorant Garamond'; color:#f3e8d6; margin-top:28px\">You're in.<\u002Fdiv>\n            <div style=\"font:400 15px/1.6 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; margin-top:12px\">Joined the room. Waiting for the host to ignite the session…<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <\u0021-- ============================ SETUP ============================ -->\n    <sc-if value=\"{{ isSetup }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1; display:flex; flex-direction:column; padding:22px 28px 28px\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; flex:0 0 auto\">\n          <div sc-camel-on-click=\"{{ setupBack }}\" style=\"cursor:pointer; width:38px; height:38px; border-radius:50%; border:1px solid rgba(201,162,75,.28); display:flex; align-items:center; justify-content:center; color:#c9a24b; font-size:17px\" style-active=\"transform:scale(.94)\">‹<\u002Fdiv>\n          <div style=\"font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.28em; text-transform:uppercase; color:#9c7e4e\">{{ setupStepLabel }}<\u002Fdiv>\n          <div style=\"width:38px\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"ttb-scroll\" style=\"flex:1; overflow-y:auto; padding-top:22px\">\n          <div style=\"font:600 36px/1.06 'Cormorant Garamond'; color:#f3e8d6\" data-comment-anchor=\"cdebf9e43d-div\">{{ setupTitle }}<\u002Fdiv>\n          <div style=\"font:400 14px/1.6 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; margin-top:10px\">{{ setupDesc }}<\u002Fdiv>\n\n          <sc-if value=\"{{ setupIsStep0 }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"position:relative; margin-top:22px; border-radius:16px; overflow:hidden\">\n              <div style=\"padding:18px 20px; background:linear-gradient(180deg,#d4ad58,#bb8f3c); pointer-events:none\">\n                <div style=\"font:600 15px/1.1 'Reo Sans','Plus Jakarta Sans'; color:#1a1206; letter-spacing:.01em\">{{ setupSessionLabel }}<\u002Fdiv>\n                <div style=\"font:500 11.5px/1 'Reo Sans','Plus Jakarta Sans'; color:rgba(26,18,6,.6); margin-top:6px; letter-spacing:.02em\">Tap to change ▾<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-raw-select sc-camel-on-change=\"{{ setupSessionChange }}\" value=\"{{ setupSessionVal }}\" style=\"position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; font-size:16px\">\n                <option value=\"1-3\">Sessions 1–3 · Early, trust-building<\u002Foption>\n                <option value=\"4-6\">Sessions 4–6 · Middle, pattern-naming<\u002Foption>\n                <option value=\"7-10\">Sessions 7–10 · Later, brave shift<\u002Foption>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ setupNotStep0 }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex; flex-direction:column; gap:10px; margin-top:22px\">\n              <sc-for list=\"{{ setupOptions }}\" as=\"opt\" hint-placeholder-count=\"3\">\n                <div sc-camel-on-click=\"{{ opt.on }}\" style=\"cursor:pointer; padding:16px 18px; border-radius:16px; background:{{ opt.bg }}; border:1px solid {{ opt.border }}; transition:all .18s ease\" style-active=\"transform:scale(.98)\">\n                  <div style=\"font:600 15px/1.1 'Reo Sans','Plus Jakarta Sans'; color:{{ opt.col }}; letter-spacing:.01em\">{{ opt.label }}<\u002Fdiv>\n                  <div style=\"font:400 12.5px/1.4 'Reo Sans','Plus Jakarta Sans'; color:{{ opt.col }}; opacity:.65; margin-top:4px\">{{ opt.desc }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ setupHasWarning }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px; padding:13px 15px; border-radius:13px; background:rgba(201,162,75,.07); border-left:3px solid rgba(201,162,75,.55)\">\n              <div style=\"font:400 13px/1.55 'Reo Sans','Plus Jakarta Sans'; color:#d8b25f\">{{ setupWarning }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; align-items:center; justify-content:center; gap:7px; margin:18px 0 14px; flex:0 0 auto\">\n          <sc-for list=\"{{ setupDots }}\" as=\"d\" hint-placeholder-count=\"6\">\n            <div style=\"width:{{ d.w }}; height:7px; border-radius:4px; background:{{ d.bg }}; transition:all .25s ease\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; gap:12px; flex:0 0 auto\">\n          <div sc-camel-on-click=\"{{ setupBack }}\" style=\"cursor:pointer; width:56px; height:54px; flex:0 0 auto; border-radius:999px; border:1px solid rgba(201,162,75,.3); display:flex; align-items:center; justify-content:center; color:#d8b25f; font-size:20px\" style-active=\"transform:scale(.96)\">‹<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ setupNext }}\" style=\"cursor:pointer; flex:1; height:54px; border-radius:999px; background:linear-gradient(180deg,#d4ad58,#bb8f3c); color:#1a1206; display:flex; align-items:center; justify-content:center; font:600 14px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.02em\" style-active=\"transform:scale(.98)\" data-comment-anchor=\"00a789fb23-div\">{{ setupNextLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <\u0021-- ============================ BRAVE CIRCLE ============================ -->\n    <sc-if value=\"{{ isBraveCircle }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1; display:flex; flex-direction:column; overflow:hidden\">\n\n        <\u0021-- header -->\n        <div style=\"display:flex; align-items:center; justify-content:space-between; padding:20px 22px 0; flex:0 0 auto\">\n          <div sc-camel-on-click=\"{{ goHome }}\" style=\"cursor:pointer; width:38px; height:38px; border-radius:50%; border:1px solid rgba(201,162,75,.28); display:flex; align-items:center; justify-content:center; color:#c9a24b; font-size:17px\" style-active=\"transform:scale(.94)\">‹<\u002Fdiv>\n          <div style=\"font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.28em; text-transform:uppercase; color:#9c7e4e\">{{ bcHeaderLabel }}<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ bcSkip }}\" style=\"cursor:pointer; font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.06em; text-transform:uppercase; color:#6f6353\">Skip ›<\u002Fdiv>\n        <\u002Fdiv>\n\n        <\u0021-- ── INTRO PHASE ── -->\n        <sc-if value=\"{{ bcIsIntro }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px 34px 34px\">\n            <div style=\"position:relative; width:132px; height:96px; margin-bottom:34px\">\n              <div style=\"position:absolute; top:4px; left:8px; width:80px; height:92px; border-radius:13px; background:radial-gradient(130% 120% at 50% -10%,#1d5536,#0c2418); border:1px solid rgba(201,162,75,.3); transform:rotate(-10deg)\"><\u002Fdiv>\n              <div style=\"position:absolute; top:4px; right:8px; width:80px; height:92px; border-radius:13px; background:radial-gradient(130% 120% at 50% -10%,#5e201b,#2a0d0a); border:1px solid rgba(201,162,75,.3); transform:rotate(10deg)\"><\u002Fdiv>\n              <div style=\"position:absolute; top:0; left:50%; transform:translateX(-50%); width:82px; height:96px; border-radius:13px; background:linear-gradient(160deg,#2a2018,#171109); border:1px solid rgba(201,162,75,.55); display:flex; align-items:center; justify-content:center; font:600 30px/1 'Cormorant Garamond'; color:#e0bd72\">?<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.32em; text-transform:uppercase; color:#9c7e4e\">The Brave Circle<\u002Fdiv>\n            <div style=\"font:600 40px/1.04 'Cormorant Garamond'; color:#f3e8d6; margin-top:14px\">One card,<br>chosen together<\u002Fdiv>\n            <div style=\"font:400 15px/1.62 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; margin-top:18px; max-width:290px\">We'll show you two real tensions at a time. Each round, pick the one your team would grow more from facing — not the easy one. After a few choices, we'll surface the card that matters most.<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ bcStart }}\" style=\"margin-top:34px; cursor:pointer; background:linear-gradient(180deg,#d4ad58,#bb8f3c); color:#1a1206; font:600 15px/1 'Reo Sans','Plus Jakarta Sans'; padding:17px 40px; border-radius:999px; box-shadow:0 14px 34px -14px rgba(201,162,75,.55)\" style-active=\"transform:scale(.97)\">Start choosing →<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <\u0021-- ── CHOOSE PHASE ── -->\n        <sc-if value=\"{{ bcIsChoose }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"flex:1; display:flex; flex-direction:column; padding:16px 22px 22px; min-height:0\">\n\n            <div style=\"flex:0 0 auto; margin-bottom:6px\">\n              <div style=\"height:4px; border-radius:999px; background:rgba(201,162,75,.14); overflow:hidden\">\n                <div style=\"height:100%; width:{{ bcRoundPct }}; background:linear-gradient(90deg,#c19a44,#e0bd72); border-radius:999px; transition:width .4s ease\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex; align-items:center; justify-content:space-between; margin-top:10px\">\n                <div style=\"font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.06em; color:#9c7e4e\">{{ bcRoundLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"font:600 19px/1.3 'Cormorant Garamond'; color:#f3e8d6; text-align:center; flex:0 0 auto; margin:8px 0 14px\">Which would your team grow more from facing?<\u002Fdiv>\n\n            <div style=\"flex:1; display:flex; flex-direction:column; gap:12px; min-height:0\">\n\n              <div sc-camel-on-click=\"{{ bcOptA.on }}\" style=\"flex:1; cursor:pointer; display:flex; flex-direction:column; padding:20px 22px; border-radius:18px; background:radial-gradient(130% 120% at 50% -10%,#1d5536,#0c2418); border:1px solid rgba(201,162,75,.34); box-shadow:0 18px 40px -22px rgba(0,0,0,.7); opacity:{{ bcOptA.dimOpacity }}; transform:{{ bcOptA.scale }}; transition:opacity .3s ease, transform .3s ease; overflow:hidden\" style-active=\"transform:scale(.98)\">\n                <div style=\"font:600 10.5px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.14em; text-transform:uppercase; color:#7fce9f; flex:0 0 auto\">{{ bcOptA.theme }}<\u002Fdiv>\n                <div style=\"font:600 27px/1.08 'Cormorant Garamond'; color:#eefbf2; margin-top:8px; flex:0 0 auto\">{{ bcOptA.name }}<\u002Fdiv>\n                <div style=\"font:400 13px/1.55 'Reo Sans','Plus Jakarta Sans'; color:#c5e2cf; margin-top:10px; flex:1; overflow:hidden\">{{ bcOptA.shift }}<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:12px\">\n                <div style=\"height:1px; flex:1; background:rgba(201,162,75,.16)\"><\u002Fdiv>\n                <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.2em; text-transform:uppercase; color:#6f6353\">or<\u002Fdiv>\n                <div style=\"height:1px; flex:1; background:rgba(201,162,75,.16)\"><\u002Fdiv>\n              <\u002Fdiv>\n\n              <div sc-camel-on-click=\"{{ bcOptB.on }}\" style=\"flex:1; cursor:pointer; display:flex; flex-direction:column; padding:20px 22px; border-radius:18px; background:radial-gradient(130% 120% at 50% -10%,#1d5536,#0c2418); border:1px solid rgba(201,162,75,.34); box-shadow:0 18px 40px -22px rgba(0,0,0,.7); opacity:{{ bcOptB.dimOpacity }}; transform:{{ bcOptB.scale }}; transition:opacity .3s ease, transform .3s ease; overflow:hidden\" style-active=\"transform:scale(.98)\">\n                <div style=\"font:600 10.5px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.14em; text-transform:uppercase; color:#7fce9f; flex:0 0 auto\">{{ bcOptB.theme }}<\u002Fdiv>\n                <div style=\"font:600 27px/1.08 'Cormorant Garamond'; color:#eefbf2; margin-top:8px; flex:0 0 auto\">{{ bcOptB.name }}<\u002Fdiv>\n                <div style=\"font:400 13px/1.55 'Reo Sans','Plus Jakarta Sans'; color:#c5e2cf; margin-top:10px; flex:1; overflow:hidden\">{{ bcOptB.shift }}<\u002Fdiv>\n              <\u002Fdiv>\n\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <\u0021-- ── REVEAL PHASE ── -->\n        <sc-if value=\"{{ bcIsReveal }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"ttb-scroll\" style=\"flex:1; overflow-y:auto; padding:18px 22px 30px\">\n\n            <div style=\"text-align:center; margin-bottom:20px\">\n              <div style=\"font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.24em; text-transform:uppercase; color:#9c7e4e\">Your team leaned toward<\u002Fdiv>\n              <div style=\"font:600 30px/1.06 'Cormorant Garamond'; color:#e0bd72; margin-top:8px\">{{ bcLeadTheme }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div sc-camel-on-click=\"{{ bcSelectRec }}\" style=\"cursor:pointer; position:relative; background:radial-gradient(130% 120% at 50% -10%,#1d5536,#0c2418); border:{{ bcRecBorder }}; border-radius:20px; padding:24px 22px 26px; box-shadow:0 24px 56px -22px rgba(0,0,0,.7)\">\n              <sc-if value=\"{{ bcRecSelected }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"position:absolute; top:14px; right:14px; width:24px; height:24px; border-radius:50%; background:#c9a24b; display:flex; align-items:center; justify-content:center; font:700 12px/1 'Reo Sans','Plus Jakarta Sans'; color:#1a1206\">✓<\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"font:600 9.5px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.06em; color:#1c0c0a; background:linear-gradient(180deg,#e0bd72,#c19a44); align-self:flex-start; display:inline-block; padding:4px 9px; border-radius:5px\">{{ bcRecCard.type }}<\u002Fdiv>\n              <div style=\"font:600 12px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.14em; text-transform:uppercase; color:#7fce9f; margin-top:14px\">{{ bcRecCard.theme }}<\u002Fdiv>\n              <div style=\"font:600 32px/1.08 'Cormorant Garamond'; color:#eefbf2; margin-top:8px\">{{ bcRecCard.name }}<\u002Fdiv>\n              <div style=\"font:400 13.5px/1.6 'Reo Sans','Plus Jakarta Sans'; color:#c5e2cf; margin-top:12px\">{{ bcRecCard.shift }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex; gap:9px; margin-top:14px; padding:0 2px\">\n              <div style=\"flex:0 0 auto; color:#c9a24b; font-size:14px; line-height:1.4\">✦<\u002Fdiv>\n              <div style=\"font:400 13px/1.55 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; font-style:italic\">{{ bcRecWhy }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ bcHasAlts }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.2em; text-transform:uppercase; color:#6f6353; margin:24px 0 12px\">Or choose an alternate<\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:9px\">\n                <sc-for list=\"{{ bcAltCards }}\" as=\"alt\" hint-placeholder-count=\"2\">\n                  <div sc-camel-on-click=\"{{ alt.on }}\" style=\"{{ alt.cardStyle }}\">\n                    <div style=\"flex:1; min-width:0\">\n                      <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.12em; text-transform:uppercase; color:#7fce9f\">{{ alt.theme }}<\u002Fdiv>\n                      <div style=\"font:600 19px/1.15 'Cormorant Garamond'; color:#eefbf2; margin-top:5px\">{{ alt.name }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ alt.picked }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"flex:0 0 auto; width:22px; height:22px; border-radius:50%; background:#c9a24b; display:flex; align-items:center; justify-content:center; font:700 11px/1 'Reo Sans','Plus Jakarta Sans'; color:#1a1206\">✓<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div sc-camel-on-click=\"{{ bcAnchorCard }}\" style=\"margin-top:22px; cursor:pointer; text-align:center; background:linear-gradient(180deg,#d4ad58,#bb8f3c); color:#1a1206; font:600 15px/1 'Reo Sans','Plus Jakarta Sans'; padding:17px; border-radius:999px; box-shadow:0 14px 34px -14px rgba(201,162,75,.55)\" style-active=\"transform:scale(.98)\">Anchor this conversation →<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ bcReset }}\" style=\"margin-top:14px; cursor:pointer; text-align:center; font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.1em; text-transform:uppercase; color:#6f6353; padding:8px\" style-active=\"opacity:.6\">Choose again ↺<\u002Fdiv>\n\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <\u0021-- ============================ GAUGE ============================ -->\n    <sc-if value=\"{{ isGauge }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1; display:flex; flex-direction:column; padding:22px 28px 28px\">\n\n        <\u0021-- header -->\n        <div style=\"display:flex; align-items:center; justify-content:space-between; flex:0 0 auto\">\n          <div sc-camel-on-click=\"{{ bcProceed }}\" style=\"cursor:pointer; width:38px; height:38px; border-radius:50%; border:1px solid rgba(201,162,75,.28); display:flex; align-items:center; justify-content:center; color:#c9a24b; font-size:17px\" style-active=\"transform:scale(.94)\">‹<\u002Fdiv>\n          <div style=\"font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.28em; text-transform:uppercase; color:#9c7e4e\">Readiness Check<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ gaugeSkip }}\" style=\"cursor:pointer; font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.06em; text-transform:uppercase; color:#6f6353\">Skip ›<\u002Fdiv>\n        <\u002Fdiv>\n\n        <\u0021-- before submission: pick your level -->\n        <sc-if value=\"{{ gaugeNotSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"flex:1; display:flex; flex-direction:column; justify-content:center\">\n            <div style=\"text-align:center; margin-bottom:28px\">\n              <div style=\"font:600 32px/1.1 'Cormorant Garamond'; color:#f3e8d6\">How ready are you to go deep today?<\u002Fdiv>\n              <div style=\"font:400 13px/1.5 'Reo Sans','Plus Jakarta Sans'; color:#8a7d6a; margin-top:10px\">Your choice is anonymous. The group sees only the lowest floor once everyone has submitted.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:10px\">\n              <div sc-camel-on-click=\"{{ gaugeSubmit1 }}\" style=\"cursor:pointer; padding:20px; border-radius:16px; background:rgba(42,111,60,.35); border:1px solid rgba(127,206,159,.3)\" style-active=\"transform:scale(.98)\">\n                <div style=\"font:600 16px/1 'Reo Sans','Plus Jakarta Sans'; color:#7fce9f\">Level 1 · Safe<\u002Fdiv>\n                <div style=\"font:400 13px/1.4 'Reo Sans','Plus Jakarta Sans'; color:#c5e2cf; opacity:.85; margin-top:6px\">Team patterns only. No personal disclosure.<\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ gaugeSubmit2 }}\" style=\"cursor:pointer; padding:20px; border-radius:16px; background:rgba(180,130,30,.18); border:1px solid rgba(201,162,75,.35)\" style-active=\"transform:scale(.98)\">\n                <div style=\"font:600 16px/1 'Reo Sans','Plus Jakarta Sans'; color:#e0bd72\">Level 2 · Honest<\u002Fdiv>\n                <div style=\"font:400 13px/1.4 'Reo Sans','Plus Jakarta Sans'; color:#d8b25f; opacity:.85; margin-top:6px\">Name it on this team. Shared experience.<\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ gaugeSubmit3 }}\" style=\"cursor:pointer; padding:20px; border-radius:16px; background:rgba(97,33,27,.45); border:1px solid rgba(201,162,75,.32)\" style-active=\"transform:scale(.98)\">\n                <div style=\"font:600 16px/1 'Reo Sans','Plus Jakarta Sans'; color:#f3e3da\">Level 3 · Real<\u002Fdiv>\n                <div style=\"font:400 13px/1.4 'Reo Sans','Plus Jakarta Sans'; color:#e7c8be; opacity:.85; margin-top:6px\">Direct personal impact. Always opt-in.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <\u0021-- after submission: waiting for others -->\n        <sc-if value=\"{{ gaugeSubmitted }}\" hint-placeholder-val=\"{{ false }}\">\n          <sc-if value=\"{{ gaugeWaiting }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center\">\n              <div style=\"width:64px; height:64px; border-radius:50%; background:rgba(42,111,60,.35); border:1px solid rgba(127,206,159,.3); display:flex; align-items:center; justify-content:center; margin-bottom:20px\">\n                <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M20 6L9 17l-5-5\" stroke=\"#7fce9f\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div style=\"font:600 26px/1.1 'Cormorant Garamond'; color:#f3e8d6\">Submitted<\u002Fdiv>\n              <div style=\"font:400 14px/1.6 'Reo Sans','Plus Jakarta Sans'; color:#8a7d6a; margin-top:10px; max-width:260px\">Waiting for the rest of the group…<\u002Fdiv>\n              <div style=\"margin-top:32px; width:100%; max-width:280px\">\n                <div style=\"background:rgba(201,162,75,.14); border-radius:4px; height:5px; overflow:hidden\">\n                  <div style=\"height:100%; background:linear-gradient(90deg,#bb8f3c,#e0bd72); border-radius:4px; width:{{ gaugeProgress }}; transition:width .5s ease\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"text-align:center; font:500 12px/1 'Reo Sans','Plus Jakarta Sans'; color:#6f6353; margin-top:10px\">{{ gaugeWaitLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ gaugeRevealed }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center\">\n              <div style=\"font:500 11px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.22em; text-transform:uppercase; color:#9c7e4e\">Today's floor<\u002Fdiv>\n              <div style=\"font:600 100px/.9 'Cormorant Garamond'; color:#e0bd72; margin-top:14px\">{{ gaugeFloorNum }}<\u002Fdiv>\n              <div style=\"font:600 30px/1 'Cormorant Garamond'; color:#f3e8d6; margin-top:8px\">{{ gaugeFloorLabel }}<\u002Fdiv>\n              <div style=\"font:400 14px/1.6 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; margin-top:14px; max-width:290px\">{{ gaugeFloorDesc }}<\u002Fdiv>\n              <div style=\"margin-top:32px; display:flex; flex-direction:column; gap:10px; width:100%\">\n                <div sc-camel-on-click=\"{{ gaugeProceed }}\" style=\"cursor:pointer; text-align:center; background:linear-gradient(180deg,#d4ad58,#bb8f3c); color:#1a1206; font:600 15px/1 'Reo Sans','Plus Jakarta Sans'; padding:17px; border-radius:999px; box-shadow:0 14px 34px -14px rgba(201,162,75,.55)\" style-active=\"transform:scale(.98)\">Begin card dialogue →<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ gaugeReset }}\" style=\"cursor:pointer; text-align:center; font:600 12px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.08em; text-transform:uppercase; color:#7a6e5c; padding:12px\" style-active=\"opacity:.6\">Reset ↺<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <\u0021-- ============================ PRACTICE ============================ -->\n    <sc-if value=\"{{ isPractice }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"ttb-scroll\" style=\"flex:1; display:flex; flex-direction:column; padding:22px 28px 28px; overflow-y:auto\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; flex:0 0 auto\">\n          <div sc-camel-on-click=\"{{ practiceBack }}\" style=\"cursor:pointer; width:38px; height:38px; border-radius:50%; border:1px solid rgba(201,162,75,.28); display:flex; align-items:center; justify-content:center; color:#c9a24b; font-size:17px\" style-active=\"transform:scale(.94)\">‹<\u002Fdiv>\n          <div style=\"font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.28em; text-transform:uppercase; color:#9c7e4e\">Practice Move<\u002Fdiv>\n          <div style=\"width:38px\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:0 0 auto; margin-top:20px\">\n          <div style=\"font:600 36px/1.06 'Cormorant Garamond'; color:#f3e8d6\">From dialogue to action<\u002Fdiv>\n          <div style=\"font:400 14px/1.6 'Reo Sans','Plus Jakarta Sans'; color:#b6a690; margin-top:10px\">Name one small behavior the team can try before next session.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:16px; margin-top:24px; flex:1\">\n          <div>\n            <div style=\"font:600 10.5px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.18em; text-transform:uppercase; color:#9c7e4e; margin-bottom:8px\">What's the practice?<\u002Fdiv>\n            <textarea ref=\"{{ practiceRef }}\" placeholder=\"One observable behavior the team commits to trying…\" style=\"width:100%; min-height:80px; background:rgba(201,162,75,.06); border:1px solid rgba(201,162,75,.3); border-radius:13px; padding:13px 14px; color:#f3e8d6; font:400 14px/1.55 'Reo Sans','Plus Jakarta Sans'; outline:none; resize:none\" style-focus=\"border-color:#d8b25f\"><\u002Ftextarea>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font:600 10.5px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.18em; text-transform:uppercase; color:#9c7e4e; margin-bottom:8px\">Who owns the system change?<\u002Fdiv>\n            <input ref=\"{{ ownerRef }}\" type=\"text\" placeholder=\"Name or role\" style=\"width:100%; background:rgba(201,162,75,.06); border:1px solid rgba(201,162,75,.3); border-radius:13px; padding:13px 14px; color:#f3e8d6; font:400 14px/1 'Reo Sans','Plus Jakarta Sans'; outline:none\" style-focus=\"border-color:#d8b25f\">\n          <\u002Fdiv>\n          <div>\n            <div style=\"font:600 10.5px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.18em; text-transform:uppercase; color:#9c7e4e; margin-bottom:8px\">How will we know it happened?<\u002Fdiv>\n            <input ref=\"{{ evidenceRef }}\" type=\"text\" placeholder=\"Observable evidence…\" style=\"width:100%; background:rgba(201,162,75,.06); border:1px solid rgba(201,162,75,.3); border-radius:13px; padding:13px 14px; color:#f3e8d6; font:400 14px/1 'Reo Sans','Plus Jakarta Sans'; outline:none\" style-focus=\"border-color:#d8b25f\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ practiceNext }}\" style=\"margin-top:20px; flex:0 0 auto; cursor:pointer; text-align:center; background:linear-gradient(180deg,#d4ad58,#bb8f3c); color:#1a1206; font:600 15px/1 'Reo Sans','Plus Jakarta Sans'; padding:17px; border-radius:999px\" style-active=\"transform:scale(.98)\">Brave commitment →<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <\u0021-- ============================ COMMIT ============================ -->\n    <sc-if value=\"{{ isCommit }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1; display:flex; flex-direction:column; padding:22px 28px 28px\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; flex:0 0 auto\">\n          <div sc-camel-on-click=\"{{ commitBack }}\" style=\"cursor:pointer; width:38px; height:38px; border-radius:50%; border:1px solid rgba(201,162,75,.28); display:flex; alig ale(.94)\">‹<\u002Fdiv>\n          <div style=\"font:600 11px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.28em; text-transform:uppercase; color:#9c7e4e\">Close &amp; Debrief<\u002Fdiv>\n          <div style=\"width:38px\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:0 0 auto; margin-top:20px\">\n          <div style=\"font:500 11px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.22em; text-transform:uppercase; color:#9c7e4e\">Closing question<\u002Fdiv>\n          <div style=\"font:600 34px/1.06 'Cormorant Garamond'; color:#f3e8d6; margin-top:10px\">What's one brave behavior we want to carry forward?<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ groupCommit }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:18px; background:radial-gradient(120% 110% at 50% 0%, #1d4632, #08190f); border:1px solid rgba(201,162,75,.3); border-radius:16px; padding:16px 18px; flex:0 0 auto\">\n            <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.18em; text-transform:uppercase; color:#7fce9f; margin-bottom:8px\">Group commitment<\u002Fdiv>\n            <div style=\"font:500 17px/1.5 'Cormorant Garamond'; color:#eefbf2\">{{ groupCommit }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ closingPractice }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:12px; background:rgba(201,162,75,.06); border:1px solid rgba(201,162,75,.2); border-radius:14px; padding:14px 16px; flex:0 0 auto\">\n            <div style=\"font:600 10px/1 'Reo Sans','Plus Jakarta Sans'; letter-spacing:.18em; text-transform:uppercase; color:#c9a24b; margin-bottom:7px\">Practice move<\u002Fdiv>\n            <div style=\"font:400 14px/1.5 'Reo Sans','Plus Jakarta Sans'; color:#e0c88a\">{{ closingPractice }}<\u002Fdiv>\n            <sc-if value=\"{{ closingOwner }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font:500 12px/1 'Reo Sans','Plus Ja
